<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GLAM ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#04040a; touch-action:none;
    font-family:'VT323',monospace; user-select:none; -webkit-user-select:none; }
  #game { display:block; width:100%; height:100%; }

  /* ---- CRT ---- */
  #crt { position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px, transparent 2px, transparent 4px);
    mix-blend-mode:multiply; }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:6;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,10,.55) 100%);
    animation:flicker 4s infinite; }
  @keyframes flicker {
    0%,100% { opacity:1; } 92% { opacity:1; } 93% { opacity:.86; } 94% { opacity:1; } 97% { opacity:.93; } 98% { opacity:1; }
  }
  @media (prefers-reduced-motion: reduce) { #vignette { animation:none; } .blink { animation:none !important; } #ov-title { animation:none !important; } }

  /* ---- HUD ---- */
  .hud { position:fixed; top:0; left:0; right:0; z-index:4; display:none;
    padding:calc(12px + env(safe-area-inset-top)) 16px 0;
    justify-content:space-between; align-items:flex-start; pointer-events:none; }
  body.playing .hud { display:flex; }
  .hud .label { font-family:'Press Start 2P',monospace; font-size:8px; letter-spacing:.1em;
    color:#22e6ff; text-shadow:0 0 6px rgba(34,230,255,.8); margin-bottom:6px; }
  .hud .value { font-family:'Press Start 2P',monospace; font-size:16px;
    color:#fff; text-shadow:0 0 8px rgba(255,45,149,.9), 0 0 2px #fff; }
  #hud2 { text-align:center; }
  #hud3 { text-align:right; }
  #hud3 .value { color:#ffe94a; text-shadow:0 0 8px rgba(255,233,74,.9); }

  /* ---- menu button during play ---- */
  #menu-btn { position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:7;
    display:none; font-family:'Press Start 2P',monospace; font-size:8px; color:rgba(34,230,255,.8);
    background:rgba(4,4,20,.7); border:1px solid rgba(34,230,255,.5); border-radius:4px;
    padding:8px 10px; cursor:pointer; }
  body.playing #menu-btn { display:block; }

  /* ---- Overlay ---- */
  #overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; background:rgba(2,2,10,.88); color:#fff; text-align:center; padding:24px;
    overflow-y:auto; touch-action:pan-y;
    opacity:0; pointer-events:none; visibility:hidden;
    transition:opacity .3s ease, visibility 0s linear .3s; }
  #overlay.show { opacity:1; pointer-events:auto; visibility:visible; transition:opacity .3s ease; }
  #ov-title { margin-top:auto; }
  #coin-line { margin-bottom:auto; }
  #ov-title { font-family:'Press Start 2P',monospace; font-size:24px; line-height:1.6; margin-bottom:12px;
    color:#ff2d95; text-shadow:0 0 14px #ff2d95, 0 0 40px rgba(255,45,149,.6), 3px 3px 0 #33003a;
    animation:neon 2.4s infinite; }
  @keyframes neon {
    0%,100% { text-shadow:0 0 14px #ff2d95, 0 0 40px rgba(255,45,149,.6), 3px 3px 0 #33003a; }
    50% { text-shadow:0 0 22px #ff2d95, 0 0 60px rgba(255,45,149,.9), 3px 3px 0 #33003a; }
  }
  #ov-sub { font-family:'Press Start 2P',monospace; font-size:9px; line-height:2;
    color:#22e6ff; text-shadow:0 0 6px rgba(34,230,255,.8); margin-bottom:20px; max-width:320px; }
  #ov-stats { font-family:'Press Start 2P',monospace; font-size:11px; line-height:2.2;
    color:#ffe94a; text-shadow:0 0 8px rgba(255,233,74,.8); margin-bottom:22px; }
  #ov-stats:empty { display:none; }
  .arcade-btn { font-family:'Press Start 2P',monospace; font-size:12px;
    color:#04040a; background:#ffe94a; border:none; border-radius:4px; padding:16px 34px; cursor:pointer;
    box-shadow:0 0 18px rgba(255,233,74,.7), 0 5px 0 #a68f00; }
  .arcade-btn:active { transform:translateY(4px); box-shadow:0 0 18px rgba(255,233,74,.7), 0 1px 0 #a68f00; }
  #ov-back { margin-top:16px; font-family:'Press Start 2P',monospace; font-size:9px; color:#22e6ff;
    background:transparent; border:1px solid rgba(34,230,255,.6); border-radius:4px; padding:12px 20px;
    cursor:pointer; text-shadow:0 0 6px rgba(34,230,255,.8); display:none; }
  #ov-back.show { display:inline-block; }

  /* ---- game select cartridges ---- */
  #game-list { display:none; flex-direction:column; gap:16px; width:min(320px, 86vw); margin-bottom:8px; }
  #game-list.show { display:flex; }
  .cart { display:flex; align-items:center; gap:14px; text-align:left;
    background:rgba(10,8,30,.9); border:2px solid #ff2d95; border-radius:8px; padding:16px;
    cursor:pointer; box-shadow:0 0 14px rgba(255,45,149,.35), inset 0 0 22px rgba(255,45,149,.08); }
  .cart:active { transform:scale(.97); }
  .cart.cyan { border-color:#22e6ff; box-shadow:0 0 14px rgba(34,230,255,.35), inset 0 0 22px rgba(34,230,255,.08); }
  .cart.yellow { border-color:#ffe94a; box-shadow:0 0 14px rgba(255,233,74,.35), inset 0 0 22px rgba(255,233,74,.08); }
  .cart.violet { border-color:#b44df0; box-shadow:0 0 14px rgba(180,77,240,.35), inset 0 0 22px rgba(180,77,240,.08); }
  .cart.mint { border-color:#3dffa2; box-shadow:0 0 14px rgba(61,255,162,.35), inset 0 0 22px rgba(61,255,162,.08); }
  .cart.orange { border-color:#ff9e2c; box-shadow:0 0 14px rgba(255,158,44,.35), inset 0 0 22px rgba(255,158,44,.08); }
  .cart .icon { font-size:34px; filter:drop-shadow(0 0 8px rgba(255,45,149,.8)); }
  .cart .name { font-family:'Press Start 2P',monospace; font-size:11px; color:#fff; line-height:1.7;
    text-shadow:0 0 8px rgba(255,45,149,.8); margin-bottom:4px; }
  .cart.cyan .name { text-shadow:0 0 8px rgba(34,230,255,.8); }
  .cart.yellow .name { text-shadow:0 0 8px rgba(255,233,74,.8); }
  .cart.violet .name { text-shadow:0 0 8px rgba(180,77,240,.8); }
  .cart.mint .name { text-shadow:0 0 8px rgba(61,255,162,.8); }
  .cart.orange .name { text-shadow:0 0 8px rgba(255,158,44,.8); }
  .cart .tag { font-family:'VT323',monospace; font-size:16px; color:rgba(255,255,255,.65); line-height:1.2; }
  .cart .hi { font-family:'Press Start 2P',monospace; font-size:8px; color:#ffe94a; margin-top:6px;
    text-shadow:0 0 6px rgba(255,233,74,.7); }

  #coin-line { font-family:'Press Start 2P',monospace; font-size:10px; color:#fff; margin-top:24px;
    text-shadow:0 0 8px rgba(255,255,255,.6); }
  .blink { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  #toast { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); pointer-events:none; z-index:8;
    font-family:'Press Start 2P',monospace; font-size:15px; color:#ffe94a; text-align:center; line-height:1.8;
    text-shadow:0 0 12px rgba(255,233,74,.9), 2px 2px 0 #4a3a00; opacity:0; transition:opacity .2s, transform .45s; }
  #toast.show { opacity:1; transform:translate(-50%,-75%); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="crt"></div>
<div id="vignette"></div>

<div class="hud">
  <div id="hud1"><div class="label"></div><div class="value"></div></div>
  <div id="hud2"><div class="label"></div><div class="value"></div></div>
  <div id="hud3"><div class="label"></div><div class="value"></div></div>
</div>

<button id="menu-btn">&#9666; MENU</button>
<div id="toast"></div>

<div id="overlay" class="show">
  <h1 id="ov-title">GLAM<br>ARCADE</h1>
  <div id="ov-sub">SELECT YOUR GAME</div>
  <div id="ov-stats"></div>

  <div id="game-list" class="show">
    <button class="cart" id="cart-lipstick">
      <span class="icon">💄</span>
      <span>
        <span class="name">LIPSTICK HIT</span><br>
        <span class="tag">Shoot lipsticks into the spinning wheel. 3 rounds, beat the clock.</span>
        <div class="hi" id="hi-lipstick">HI 000000</div>
      </span>
    </button>
    <button class="cart cyan" id="cart-stack">
      <span class="icon">💅</span>
      <span>
        <span class="name">POLISH STACK</span><br>
        <span class="tag">Drop &amp; stack polish bars. Perfect drops build combos.</span>
        <div class="hi" id="hi-stack">HI 0</div>
      </span>
    </button>
    <button class="cart yellow" id="cart-perfume">
      <span class="icon">🌸</span>
      <span>
        <span class="name">PERFUME POP</span><br>
        <span class="tag">Spritz the scent bubbles before time runs out. Don't pop the stinkers!</span>
        <div class="hi" id="hi-perfume">HI 000000</div>
      </span>
    </button>
    <button class="cart violet" id="cart-gems">
      <span class="icon">💎</span>
      <span>
        <span class="name">GEM CRUSH</span><br>
        <span class="tag">Swap &amp; match 3+ gems. Forge flames, lightning &amp; prisms!</span>
        <div class="hi" id="hi-gems">HI 000000</div>
      </span>
    </button>
    <button class="cart mint" id="cart-darts">
      <span class="icon">🎯</span>
      <span>
        <span class="name">GLITTER DARTS</span><br>
        <span class="tag">Tap to throw when the sparkle sweeps the board. Endless levels, ever harder.</span>
        <div class="hi" id="hi-darts">HI 000000</div>
      </span>
    </button>
    <button class="cart orange" id="cart-quest">
      <span class="icon">👑</span>
      <span>
        <span class="name">GLAM QUEST</span><br>
        <span class="tag">Run, double-jump &amp; stomp through 5 neon worlds. Arrows/WASD + Space, or touch.</span>
        <div class="hi" id="hi-quest">HI 000000</div>
      </span>
    </button>
  </div>

  <button class="arcade-btn" id="ov-btn" style="display:none">START</button>
  <button id="ov-back">&#9666; GAME SELECT</button>
  <div id="coin-line" class="blink">INSERT COIN</div>
</div>

<script>
(() => {
"use strict";

// ============================================================
//  SHARED ARCADE CORE
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const $ovTitle = document.getElementById('ov-title');
const $ovSub = document.getElementById('ov-sub');
const $ovStats = document.getElementById('ov-stats');
const $ovBtn = document.getElementById('ov-btn');
const $ovBack = document.getElementById('ov-back');
const $gameList = document.getElementById('game-list');
const $toast = document.getElementById('toast');
const $menuBtn = document.getElementById('menu-btn');
const hudEls = [1,2,3].map(i => {
  const box = document.getElementById('hud' + i);
  return { label: box.querySelector('.label'), value: box.querySelector('.value') };
});

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---- chiptune audio ----
let AC = null;
function beep(freq, dur, type, vol) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch(e) {}
}
const sndFail = () => { [220,180,140,100].forEach((f,i)=>setTimeout(()=>beep(f,.14,'square',.12), i*110)); };
const sndClear = () => { [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.12,'square',.1), i*100)); };
const sndVictory = () => { [523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.11), i*130)); };
const sndCoin = () => { beep(988, .08, 'square', .1); setTimeout(()=>beep(1319,.22,'square',.1), 80); };
const sndTick = () => { beep(1400, .05, 'square', .08); };
const sndSelect = () => { beep(660, .07, 'square', .1); setTimeout(()=>beep(880,.1,'square',.1), 70); };

// ---- palette ----
const NEON_PINK = '#ff2d95', NEON_CYAN = '#22e6ff', NEON_YELLOW = '#ffe94a';

// ---- shared particles ----
let particles = [];
function burst(x, y, color) {
  const cols = [color, NEON_CYAN, NEON_YELLOW, '#fff'];
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 240;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 60,
      life: .5 + Math.random()*.5, size: 3 + Math.floor(Math.random()*4),
      color: cols[Math.floor(Math.random()*cols.length)] });
  }
}
function drawParticles(dt) {
  particles = particles.filter(p => (p.life -= dt) > 0);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt;
    ctx.globalAlpha = Math.min(1, p.life / .5);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    ctx.globalAlpha = 1;
  }
}

// ---- fireworks ----
let rockets = [], sparks = [];
function resetFX() { particles = []; rockets = []; sparks = []; }
function sndWhoosh() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(950, t + .5);
    g.gain.setValueAtTime(.05, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + .55);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(t + .55);
  } catch(e) {}
}
function sndBoom() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    // deep thump
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(40, t + .5);
    g.gain.setValueAtTime(.3, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + .6);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(t + .6);
    // crackle
    const len = Math.floor(AC.sampleRate * .35);
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = AC.createBufferSource(); src.buffer = buf;
    const ng = AC.createGain(); ng.gain.value = .18;
    src.connect(ng); ng.connect(AC.destination);
    src.start();
  } catch(e) {}
}
function launchFirework(x) {
  rockets.push({
    x: x !== undefined ? x : W * (0.15 + Math.random() * 0.7),
    y: H + 10,
    vy: -(H * 1.05 + Math.random() * H * 0.3),
    targetY: H * (0.14 + Math.random() * 0.28),
    hue: Math.floor(Math.random() * 360),
    trail: 0,
  });
  sndWhoosh();
}
function updateFireworks(dt) {
  // rockets rise, leaving a sparkle trail
  for (const r of rockets) {
    r.y += r.vy * dt;
    r.trail -= dt;
    if (r.trail <= 0) {
      sparks.push({ x: r.x + (Math.random()-.5)*3, y: r.y, vx: 0, vy: 60,
        life: .3, size: 2, hue: r.hue, white: true });
      r.trail = .016;
    }
    ctx.fillStyle = '#fff';
    ctx.fillRect(r.x - 1.5, r.y - 4, 3, 8);
  }
  const exploded = rockets.filter(r => r.y <= r.targetY);
  rockets = rockets.filter(r => r.y > r.targetY);
  for (const r of exploded) {
    sndBoom();
    const n = 48;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + (Math.random()-.5) * .2;
      const sp = 90 + Math.random() * 230;
      sparks.push({ x: r.x, y: r.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1 + Math.random() * .8, size: 2 + Math.floor(Math.random()*3),
        hue: r.hue + (Math.random()-.5) * 40, white: Math.random() < .18 });
    }
  }
  // sparks fall with gravity, twinkling out
  sparks = sparks.filter(s => (s.life -= dt) > 0);
  for (const s of sparks) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.vy += 220 * dt;
    s.vx *= Math.max(0, 1 - 1.1 * dt);
    const tw = s.white ? 1 : .55 + .45 * Math.sin(s.life * 28);
    ctx.globalAlpha = Math.min(1, s.life) * tw;
    ctx.fillStyle = s.white ? '#fff' : `hsl(${s.hue}, 100%, 65%)`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1;
}

// ---- shared background ----
function drawArcadeBG(time) {
  ctx.fillStyle = '#04040a';
  ctx.fillRect(0, 0, W, H);
  const horizon = H * 0.55;
  ctx.strokeStyle = 'rgba(255,45,149,.14)';
  ctx.lineWidth = 1;
  const scroll = (time * 40) % 40;
  for (let i = 0; i < 14; i++) {
    const p = (i * 40 + scroll) / (14 * 40);
    const y = horizon + Math.pow(p, 2.2) * (H - horizon);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let i = -8; i <= 8; i++) {
    ctx.beginPath();
    ctx.moveTo(W/2 + i * W * 0.09, horizon);
    ctx.lineTo(W/2 + i * W * 0.35, H);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(34,230,255,.5)';
  for (let i = 0; i < 24; i++) {
    const x = ((i * 137.5) % W);
    const y = ((i * 89.3) % horizon);
    const tw = (Math.sin(time * 2 + i) + 1) / 2;
    ctx.globalAlpha = 0.15 + tw * 0.4;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
}

// ---- HUD + overlay helpers ----
function setHUD(labels) {
  hudEls.forEach((el, i) => { el.label.textContent = labels[i] || ''; });
}
function hudVal(i, v) { hudEls[i].value.textContent = v; }

function toast(msg) {
  if (!msg) return;
  $toast.innerHTML = String(msg).replace('\n', '<br>');
  $toast.classList.add('show');
  setTimeout(() => $toast.classList.remove('show'), 1000);
}

let active = null;   // current game object
let epoch = 0;       // bumps on every screen change; stale timeouts self-cancel
function later(fn, ms) {
  const e = epoch;
  setTimeout(() => { if (e === epoch) fn(); }, ms);
}

function showMenu() {
  epoch++;
  active = null;
  document.body.classList.remove('playing');
  $ovTitle.innerHTML = 'GLAM<br>ARCADE';
  $ovSub.innerHTML = 'SELECT YOUR GAME';
  $ovStats.innerHTML = '';
  $gameList.classList.add('show');
  $ovBtn.style.display = 'none';
  $ovBack.classList.remove('show');
  document.getElementById('hi-lipstick').textContent = 'HI ' + String(GameLipstick.best).padStart(6,'0');
  document.getElementById('hi-stack').textContent = 'HI ' + GameStack.best;
  document.getElementById('hi-perfume').textContent = 'HI ' + String(GamePerfume.best).padStart(6,'0');
  document.getElementById('hi-gems').textContent = 'HI ' + String(GameGems.best).padStart(6,'0');
  document.getElementById('hi-darts').textContent = 'HI ' + String(GameDarts.best).padStart(6,'0');
  document.getElementById('hi-quest').textContent = 'HI ' + String(GameQuest.best).padStart(6,'0');
  overlay.classList.add('show');
}

// end screen for a game; primary button retries, back returns to menu
function showEnd(opts) {
  $ovTitle.innerHTML = opts.title;
  $ovSub.innerHTML = opts.sub || '';
  $ovStats.innerHTML = opts.stats || '';
  $gameList.classList.remove('show');
  $ovBtn.style.display = 'inline-block';
  $ovBtn.textContent = opts.btn || 'CONTINUE?';
  $ovBack.classList.add('show');
  overlay.classList.add('show');
}

function launch(game) {
  epoch++;
  sndSelect();
  active = game;
  overlay.classList.remove('show');
  document.body.classList.add('playing');
  game.start();
}

// ============================================================
//  GAME 1: LIPSTICK HIT
// ============================================================
const GameLipstick = (() => {
  const SHADES = ['#ff2d95','#ff4d4d','#ff7ab8','#e02be0','#ff3355','#ff66a3'];
  const STAGES = [
    { shots: 6,  time: 30, speed: 1.5, spinMin: 1.6, spinMax: 2.8, pause: 0.30, pre: 0, coins: 1 },
    { shots: 8,  time: 25, speed: 2.2, spinMin: 1.1, spinMax: 2.0, pause: 0.18, pre: 2, coins: 1 },
    { shots: 10, time: 22, speed: 3.0, spinMin: 0.7, spinMax: 1.5, pause: 0.10, pre: 4, coins: 2 },
  ];
  const S = { PLAY:1, FLY:2, LEVELUP:3, DEAD:4, WIN:5 };

  let state, stage, score, rot, rotSpeed, spin, stuck, coinsArr, remaining;
  let timeLeft, timeTotal, lastWholeSec, fly, heldShade, shake, deadAnim, flash;
  let time = 0;

  const G = { name: 'LIPSTICK HIT', best: 0 };

  const sndStick = () => { beep(160, .07, 'square', .12); beep(640, .05, 'square', .06); };

  function wheelGeom() {
    const R = Math.min(W, H * 0.62) * 0.30;
    return { cx: W/2, cy: H * 0.30 + 10, R: Math.max(70, Math.min(R, 140)) };
  }
  function lipLen() { return wheelGeom().R * 1.05; }
  function cfg() { return STAGES[stage - 1]; }

  function newSpin(c) {
    return { dir: Math.random() < .5 ? 1 : -1, phase: 'spin',
      timer: c.spinMin + Math.random() * (c.spinMax - c.spinMin) };
  }
  function updateSpin(dt) {
    const c = cfg();
    if (!spin) return;
    spin.timer -= dt;
    if (spin.phase === 'spin') {
      rotSpeed += (spin.dir * c.speed - rotSpeed) * Math.min(1, dt * 4);
      if (spin.timer <= 0) { spin.phase = 'stopping'; spin.timer = 0.45; }
    } else if (spin.phase === 'stopping') {
      rotSpeed += (0 - rotSpeed) * Math.min(1, dt * 7);
      if (spin.timer <= 0) { spin.phase = 'paused'; spin.timer = c.pause; rotSpeed = 0; }
    } else {
      rotSpeed = 0;
      if (spin.timer <= 0) {
        spin.dir = Math.random() < .5 ? 1 : -1;   // random fresh direction
        spin.phase = 'spin';
        spin.timer = c.spinMin + Math.random() * (c.spinMax - c.spinMin);
      }
    }
    rot += rotSpeed * dt;
  }

  function setupStage(n) {
    const c = STAGES[n - 1];
    stuck = []; coinsArr = []; fly = null;
    remaining = c.shots;
    timeLeft = c.time; timeTotal = c.time; lastWholeSec = c.time;
    heldShade = SHADES[n % SHADES.length];
    spin = newSpin(c);
    rotSpeed = 0;

    for (let i = 0; i < c.pre; i++) {
      let a, ok, tries = 0;
      do {
        a = Math.random() * Math.PI * 2; ok = true;
        for (const s of stuck) if (angDiff(a, s.a) < minGap() * 1.6) { ok = false; break; }
      } while (!ok && ++tries < 40);
      if (ok) stuck.push({ a, shade: SHADES[(n+1+i) % SHADES.length], pre: true });
    }
    for (let i = 0; i < c.coins; i++) {
      let a, ok, tries = 0;
      do {
        a = Math.random() * Math.PI * 2; ok = true;
        for (const s of stuck) if (angDiff(a, s.a) < minGap() * 1.4) { ok = false; break; }
        for (const co of coinsArr) if (angDiff(a, co.a) < 0.6) { ok = false; break; }
      } while (!ok && ++tries < 40);
      if (ok) coinsArr.push({ a, alive: true });
    }
    updateHUD();
  }

  function minGap() {
    const g = wheelGeom();
    const bodyW = lipLen() * 0.16 * 1.16;
    return (bodyW / g.R) * 0.95;
  }
  function angDiff(a, b) {
    let d = Math.abs(a - b) % (Math.PI * 2);
    return d > Math.PI ? Math.PI * 2 - d : d;
  }
  function norm(a) { a %= Math.PI*2; return a < 0 ? a + Math.PI*2 : a; }
  function updateHUD() {
    hudVal(0, remaining);
    hudVal(1, stage + '/3');
    hudVal(2, String(score).padStart(6, '0'));
  }

  function drawLipstick(x, y, ang, shade, glow) {
    const L = lipLen();
    const w = L * 0.16;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    if (glow) { ctx.shadowColor = shade; ctx.shadowBlur = 16; }
    const tipH = L * 0.34, caseH = L * 0.16, baseH = L * 0.50;
    let yy = -L/2;
    ctx.beginPath();
    ctx.moveTo(-w/2, yy + tipH);
    ctx.lineTo(-w/2, yy + tipH*0.42);
    ctx.quadraticCurveTo(-w/2, yy, w/2*0.7, yy + tipH*0.14);
    ctx.lineTo(w/2, yy + tipH*0.5);
    ctx.lineTo(w/2, yy + tipH);
    ctx.closePath();
    ctx.fillStyle = shade; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(-w/2 + w*0.12, yy + tipH*0.28, w*0.16, tipH*0.6);
    yy += tipH;
    ctx.fillStyle = NEON_YELLOW;
    ctx.fillRect(-w/2 - w*0.08, yy, w + w*0.16, caseH);
    yy += caseH;
    ctx.shadowBlur = 0;
    const grd2 = ctx.createLinearGradient(-w/2,0,w/2,0);
    grd2.addColorStop(0, '#12102a'); grd2.addColorStop(.45, '#3a2a66'); grd2.addColorStop(1, '#12102a');
    ctx.fillStyle = grd2;
    const r = w*0.22;
    ctx.beginPath();
    ctx.moveTo(-w/2 - w*0.08, yy);
    ctx.lineTo(w/2 + w*0.08, yy);
    ctx.lineTo(w/2 + w*0.08, yy + baseH - r);
    ctx.quadraticCurveTo(w/2 + w*0.08, yy + baseH, w/2 + w*0.08 - r, yy + baseH);
    ctx.lineTo(-w/2 - w*0.08 + r, yy + baseH);
    ctx.quadraticCurveTo(-w/2 - w*0.08, yy + baseH, -w/2 - w*0.08, yy + baseH - r);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(34,230,255,.5)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = NEON_CYAN;
    ctx.fillRect(-w*0.14, yy + baseH*0.42, w*0.28, w*0.28);
    ctx.restore();
  }

  function drawCoin(x, y, r) {
    const squish = Math.abs(Math.sin(time * 4));
    ctx.save();
    ctx.translate(x, y);
    ctx.shadowColor = NEON_YELLOW; ctx.shadowBlur = 12;
    ctx.fillStyle = NEON_YELLOW;
    ctx.beginPath();
    ctx.ellipse(0, 0, Math.max(r * squish, r*0.15), r, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (squish > 0.5) {
      ctx.fillStyle = '#a68f00';
      ctx.font = `bold ${r*1.2}px 'VT323', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('¢', 0, 1);
    }
    ctx.restore();
  }

  function drawWheel(g) {
    const { cx, cy, R } = g;
    ctx.save();
    const sx = (Math.random()-.5) * shake, sy = (Math.random()-.5) * shake;
    ctx.translate(cx + sx, cy + sy);

    ctx.beginPath(); ctx.arc(0, 0, R*1.3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,45,149,.05)'; ctx.fill();

    if (state === S.PLAY || state === S.FLY) {
      const frac = Math.max(0, timeLeft / timeTotal);
      const low = timeLeft <= 5;
      ctx.beginPath();
      ctx.arc(0, 0, R * 1.18, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(34,230,255,.15)'; ctx.lineWidth = 5; ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, R * 1.18, -Math.PI/2, -Math.PI/2 + frac * Math.PI * 2);
      ctx.strokeStyle = low ? '#ff3355' : NEON_CYAN;
      ctx.shadowColor = low ? '#ff3355' : NEON_CYAN; ctx.shadowBlur = 10;
      ctx.lineWidth = low ? 6 + Math.sin(time*10)*1.5 : 5;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    ctx.rotate(rot);
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2);
    ctx.fillStyle = '#0d0b1e'; ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = NEON_PINK;
    ctx.shadowColor = NEON_PINK; ctx.shadowBlur = 18;
    ctx.stroke();
    ctx.shadowBlur = 0;
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      ctx.strokeStyle = i % 3 === 0 ? NEON_CYAN : 'rgba(34,230,255,.35)';
      ctx.lineWidth = i % 3 === 0 ? 3 : 1.5;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*R*0.72, Math.sin(a)*R*0.72);
      ctx.lineTo(Math.cos(a)*R*0.94, Math.sin(a)*R*0.94);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,R*0.62,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(255,45,149,.4)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,R*0.34,0,Math.PI*2);
    ctx.fillStyle = '#1a0f2e'; ctx.fill();
    ctx.strokeStyle = 'rgba(34,230,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = `${R*0.34}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = NEON_PINK; ctx.shadowBlur = 12;
    ctx.fillText('💋', 0, R*0.02);
    ctx.shadowBlur = 0;
    ctx.restore();

    if (state === S.PLAY || state === S.FLY) {
      const low = timeLeft <= 5;
      ctx.font = `${low ? 22 : 16}px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = low ? '#ff3355' : NEON_CYAN;
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
      ctx.fillText(Math.ceil(timeLeft), cx, cy + g.R * 1.5);
      ctx.shadowBlur = 0;
    }

    for (const co of coinsArr) {
      if (!co.alive) continue;
      const A = rot + co.a;
      drawCoin(cx + Math.cos(A) * (R + 16) + sx, cy + Math.sin(A) * (R + 16) + sy, 11);
    }

    for (const s of stuck) {
      const A = rot + s.a;
      const L = lipLen();
      const d = R + L/2 - L*0.30;
      const x = cx + Math.cos(A) * d + sx, y = cy + Math.sin(A) * d + sy;
      drawLipstick(x, y, A - Math.PI/2 + Math.PI, s.shade, false);
    }
  }

  function shoot() {
    if (state !== S.PLAY || fly || remaining <= 0) return;
    fly = { y: H * 0.82, shade: heldShade };
    state = S.FLY;
    beep(320, .05, 'square', .07);
  }

  function stickAt(rotAtHit) {
    const relA = norm(Math.PI/2 - rotAtHit);
    for (const co of coinsArr) {
      if (co.alive && angDiff(relA, co.a) < 0.30) {
        co.alive = false; score += 3; sndCoin();
        const g = wheelGeom();
        burst(g.cx, g.cy + g.R, NEON_YELLOW);
        toast('+3 COIN!');
      }
    }
    for (const s of stuck) {
      if (angDiff(relA, s.a) < minGap()) return false;
    }
    stuck.push({ a: relA, shade: fly.shade });
    score += 1; remaining -= 1;
    shake = 7; sndStick();
    heldShade = SHADES[Math.floor(Math.random() * SHADES.length)];
    updateHUD();
    return true;
  }

  function stageClear() {
    const bonus = Math.floor(timeLeft / 2);
    score += bonus;
    updateHUD();
    if (stage >= 3) { win(); return; }
    state = S.LEVELUP; sndClear();
    const g = wheelGeom();
    burst(g.cx, g.cy, NEON_PINK);
    burst(g.cx, g.cy, NEON_YELLOW);
    toast(bonus > 0 ? `ROUND CLEAR!\nTIME BONUS +${bonus}` : 'ROUND CLEAR!');
    later(() => { stage++; setupStage(stage); state = S.PLAY;
      toast(stage === 2 ? 'SPEED UP!' : 'FINAL ROUND!'); }, 1400);
  }

  function win() {
    state = S.WIN; sndVictory();
    G.best = Math.max(G.best, score);
    // fireworks salvo!
    for (let i = 0; i < 10; i++)
      later(() => launchFirework(), 200 + i * 320);
    later(() => {
      showEnd({ title: 'YOU WIN!', sub: 'ALL 3 ROUNDS CLEARED',
        stats: `SCORE ${String(score).padStart(6,'0')}<br>HI&nbsp;&nbsp;&nbsp; ${String(G.best).padStart(6,'0')}`,
        btn: 'PLAY AGAIN' });
    }, 3600);
  }

  function die(reason) {
    state = S.DEAD; sndFail(); flash = 1;
    deadAnim = { y: H * 0.62, vy: -180, vr: 9, r: 0, shade: fly ? fly.shade : heldShade };
    fly = null;
    G.best = Math.max(G.best, score);
    later(() => {
      showEnd({ title: 'GAME OVER',
        sub: reason === 'time' ? 'TIME UP!' : 'LIPSTICK CLASH!',
        stats: `SCORE ${String(score).padStart(6,'0')}<br>HI&nbsp;&nbsp;&nbsp; ${String(G.best).padStart(6,'0')}<br>ROUND ${stage}/3`,
        btn: 'CONTINUE?' });
    }, 900);
  }

  G.start = function() {
    setHUD(['SHOTS', 'ROUND', 'SCORE']);
    stage = 1; score = 0; deadAnim = null; resetFX();
    rot = 0; shake = 0; flash = 0;
    setupStage(1);
    state = S.PLAY;
  };

  G.tap = shoot;

  G.frame = function(dt) {
    time += dt;
    if (state === S.PLAY || state === S.FLY || state === S.LEVELUP) updateSpin(dt);

    if (state === S.PLAY || state === S.FLY) {
      timeLeft -= dt;
      const whole = Math.ceil(timeLeft);
      if (whole !== lastWholeSec && whole <= 5 && whole > 0) { sndTick(); lastWholeSec = whole; }
      if (timeLeft <= 0) { timeLeft = 0; die('time'); }
    }

    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 3);

    drawArcadeBG(time);
    const g = wheelGeom();

    if (state === S.FLY && fly) {
      const prevTipY = fly.y - lipLen()/2;
      fly.y -= 2200 * dt;
      const tipY = fly.y - lipLen()/2;
      const rim = g.cy + g.R;
      if (tipY <= rim) {
        const f = (prevTipY - rim) / Math.max(prevTipY - tipY, 0.0001);
        const rotAtHit = rot - rotSpeed * dt * (1 - Math.min(Math.max(f, 0), 1));
        if (stickAt(rotAtHit)) {
          fly = null;
          if (remaining <= 0) stageClear();
          else state = S.PLAY;
        } else {
          die('clash');
        }
      }
    }

    drawWheel(g);

    if (state === S.PLAY && remaining > 0) {
      const bob = Math.sin(time * 3) * 4;
      drawLipstick(W/2, H * 0.82 + bob, 0, heldShade, true);
      ctx.fillStyle = NEON_CYAN;
      for (let i = 0; i < remaining - 1; i++) {
        ctx.fillRect(W/2 - ((remaining-2)*10)/2 + i*10 - 2, H*0.82 + lipLen()*0.72, 5, 5);
      }
    }
    if (fly) drawLipstick(W/2, fly.y, 0, fly.shade, true);

    if (deadAnim) {
      deadAnim.vy += 1400 * dt;
      deadAnim.y += deadAnim.vy * dt;
      deadAnim.r += deadAnim.vr * dt;
      if (deadAnim.y < H + 200) drawLipstick(W/2, deadAnim.y, deadAnim.r, deadAnim.shade, true);
    }

    drawParticles(dt);
    updateFireworks(dt);

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,51,85,${flash * .35})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === S.PLAY) {
      ctx.font = `9px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = (Math.floor(time * 2) % 2) ? 'rgba(34,230,255,.7)' : 'rgba(34,230,255,.25)';
      ctx.fillText('TAP TO SHOOT', W/2, H - 24);
    }
  };

  G.retry = G.start;
  return G;
})();

// ============================================================
//  GAME 2: NAIL POLISH STACK
// ============================================================
const GameStack = (() => {
  const S = { PLAY:1, DEAD:2 };
  const LAYER_H = 26, PERFECT_TOL = 6, MIN_W = 10;

  let state, layers, mover, falls, cam, camTarget, combo, heightCount, flash, shake;
  let time = 0;

  const G = { name: 'POLISH STACK', best: 0 };

  const sndDrop = () => { beep(180, .06, 'square', .1); };
  const sndTrim = () => { beep(120, .09, 'square', .09); };
  const sndPerfect = (n) => { beep(523 * Math.pow(1.12, Math.min(n, 10)), .12, 'square', .11); };

  function shadeFor(i) { return `hsl(${(320 + i * 24) % 360}, 95%, 60%)`; }
  function shadeDark(i) { return `hsl(${(320 + i * 24) % 360}, 95%, 38%)`; }
  function baseW() { return Math.min(W * 0.62, 300); }
  function layerScreenY(i) { return H * 0.74 - i * LAYER_H + cam; }

  function spawnMover() {
    const top = layers[layers.length - 1];
    const i = layers.length;
    const fromLeft = i % 2 === 1;
    mover = {
      w: top.w,
      x: fromLeft ? -top.w : W,
      dir: fromLeft ? 1 : -1,
      speed: 200 + Math.min(heightCount * 9, 380),
      i,
    };
  }

  function updateHUD() {
    hudVal(0, heightCount);
    hudVal(1, combo > 1 ? 'x' + combo : '-');
    hudVal(2, G.best);
  }

  function drop() {
    if (state !== S.PLAY || !mover) return;
    const below = layers[layers.length - 1];
    const left = Math.max(mover.x, below.x);
    const right = Math.min(mover.x + mover.w, below.x + below.w);
    const overlap = right - left;

    if (overlap <= MIN_W * 0.4) {
      falls.push({ x: mover.x, y: layerScreenY(mover.i) - cam, w: mover.w,
        vy: -60, vr: (Math.random()-.5)*8, r: 0, i: mover.i });
      mover = null;
      die();
      return;
    }

    const offset = Math.abs(mover.x - below.x);
    if (offset <= PERFECT_TOL) {
      combo++;
      layers.push({ x: below.x, w: mover.w, i: mover.i });
      sndPerfect(combo);
      burst(below.x + mover.w/2, layerScreenY(mover.i), NEON_YELLOW);
      if (combo >= 2) toast('PERFECT x' + combo);
      if (combo % 3 === 0) {
        const top = layers[layers.length - 1];
        const grow = Math.min(baseW() - top.w, 24);
        if (grow > 0) {
          top.x -= grow/2; top.w += grow;
          toast('WIDTH UP!');
          sndClear();
        }
      }
    } else {
      combo = 0;
      const cutW = mover.w - overlap;
      const cutX = mover.x < below.x ? mover.x : right;
      falls.push({ x: cutX, y: layerScreenY(mover.i) - cam, w: cutW,
        vy: 0, vr: (Math.random()-.5)*6, r: 0, i: mover.i });
      layers.push({ x: left, w: overlap, i: mover.i });
      sndDrop(); later(sndTrim, 40);
      if (overlap < MIN_W) { mover = null; die(); return; }
    }

    heightCount++;
    shake = 4;
    camTarget = Math.max(0, (layers.length - 1) * LAYER_H - H * 0.28);
    if (heightCount === 10 || heightCount === 25 || heightCount === 50 || heightCount === 100) {
      toast(heightCount === 10 ? 'NICE!' : heightCount === 25 ? 'ON FIRE!' : heightCount === 50 ? 'UNSTOPPABLE!' : 'LEGENDARY!');
      sndClear();
      if (heightCount >= 50) for (let k = 0; k < 3; k++) later(() => launchFirework(), k * 350);
    }
    updateHUD();
    spawnMover();
  }

  function die() {
    state = S.DEAD; sndFail(); flash = 1;
    G.best = Math.max(G.best, heightCount);
    updateHUD();
    later(() => {
      showEnd({ title: 'GAME OVER', sub: 'THE TOWER TOPPLED',
        stats: `HEIGHT ${heightCount}<br>BEST&nbsp;&nbsp; ${G.best}`,
        btn: 'CONTINUE?' });
    }, 1000);
  }

  function drawBar(x, y, w, i, isMover) {
    ctx.save();
    const fill = shadeFor(i), dark = shadeDark(i);
    ctx.shadowColor = fill; ctx.shadowBlur = isMover ? 16 : 8;
    const grd = ctx.createLinearGradient(0, y, 0, y + LAYER_H);
    grd.addColorStop(0, fill); grd.addColorStop(1, dark);
    ctx.fillStyle = grd;
    ctx.fillRect(x, y, w, LAYER_H - 2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.fillRect(x + 3, y + 3, Math.max(w - 6, 0), 4);
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + .5, y + .5, w - 1, LAYER_H - 3);
    if (isMover) {
      const capW = Math.min(w * 0.4, 54);
      ctx.fillStyle = '#12102a';
      ctx.fillRect(x + w/2 - capW/2, y - 14, capW, 14);
      ctx.strokeStyle = NEON_CYAN; ctx.lineWidth = 1;
      ctx.strokeRect(x + w/2 - capW/2 + .5, y - 13.5, capW - 1, 13);
    }
    ctx.restore();
  }

  G.start = function() {
    setHUD(['HEIGHT', 'COMBO', 'BEST']);
    layers = [{ x: W/2 - baseW()/2, w: baseW(), i: 0 }];
    falls = []; resetFX();
    cam = 0; camTarget = 0;
    combo = 0; heightCount = 0;
    flash = 0; shake = 0;
    spawnMover();
    updateHUD();
    state = S.PLAY;
  };

  G.tap = drop;

  G.frame = function(dt) {
    time += dt;
    cam += (camTarget - cam) * Math.min(1, dt * 5);
    flash = Math.max(0, flash - dt * 3);
    shake = Math.max(0, shake - dt * 30);

    if (state === S.PLAY && mover) {
      mover.x += mover.dir * mover.speed * dt;
      if (mover.dir > 0 && mover.x > W - mover.w * 0.25) mover.dir = -1;
      if (mover.dir < 0 && mover.x < -mover.w * 0.75) mover.dir = 1;
    }

    drawArcadeBG(time);

    const sx = (Math.random()-.5) * shake, sy = (Math.random()-.5) * shake;
    ctx.save();
    ctx.translate(sx, sy);

    for (const L of layers) {
      const y = layerScreenY(L.i);
      if (y < -LAYER_H || y > H + LAYER_H) continue;
      drawBar(L.x, y, L.w, L.i, false);
    }

    if (state === S.PLAY && mover) {
      drawBar(mover.x, layerScreenY(mover.i), mover.w, mover.i, true);
    }

    falls = falls.filter(f => f.y + cam < H + 100);
    for (const f of falls) {
      f.vy += 1500 * dt;
      f.y += f.vy * dt;
      f.r += f.vr * dt;
      ctx.save();
      ctx.translate(f.x + f.w/2, f.y + cam + LAYER_H/2);
      ctx.rotate(f.r);
      ctx.globalAlpha = .85;
      ctx.fillStyle = shadeDark(f.i);
      ctx.fillRect(-f.w/2, -LAYER_H/2, f.w, LAYER_H - 2);
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    ctx.restore();

    drawParticles(dt);
    updateFireworks(dt);

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,51,85,${flash * .35})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === S.PLAY) {
      ctx.font = `9px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center';

// ============================================================
//  GAME 4: GEM CRUSH

const GameGems = (() => {
  const S = { IDLE:1, SWAP:2, CLEAR:3, FALL:4, SHUFFLE:5, LEVELUP:6, DEAD:7, WIN:8 };

  const SP = { FLAME:1, CROSS:2, PRISM:3 };
  const ROUNDS = [
    { target: 500,  time: 60 },
    { target: 800,  time: 65 },
    { target: 1200, time: 70 },
  ];
  const SWAP_T = .17, CLEAR_T = .30, GRAV = 3200;

  let state, round, score, roundScore, timeLeft, timeTotal, lastWholeSec;
  let board, sel, drag, swp, clearT, cascade, shuffleT, shuffleMid, idleT, hint;
  let pops, rings, bolts, beams, shake, flash, landSndT;
  let time = 0;

  const G = { name:'GEM CRUSH', best: 0 };

  // ---- sounds ----
  const sndSwap = () => beep(420, .05, 'square', .07);
  const sndBad = () => { beep(220,.07,'square',.09); setTimeout(()=>beep(160,.09,'square',.09), 60); };
  const sndPop = (n) => { beep(392 * Math.pow(1.122, Math.min(n, 12)), .1, 'square', .1);
    setTimeout(()=>beep(523 * Math.pow(1.122, Math.min(n, 12)), .08, 'square', .06), 50); };
  const sndLand = () => beep(130, .03, 'square', .045);
  const sndZap = () => {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(1600, t);
      o.frequency.exponentialRampToValueAtTime(90, t + .28);
      g.gain.setValueAtTime(.14, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .3);

      o.start(); o.stop(t + .3);
    } catch(e) {}
  };
  const sndPrism = () => [880,1109,1319,1760].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.12), i*70));

  // ---- geometry ----
  function geom() {
    const cell = Math.floor(Math.min((W - 16) / COLS, (H - 200) / ROWS, 64));
    const bw = cell * COLS;
    return { bx: (W - bw) / 2, by: Math.max(84, (H - cell * ROWS) / 2 - 6), cell };
  }
  function cellAt(px, py) {
    const g = geom();
    const c = Math.floor((px - g.bx) / g.cell), r = Math.floor((py - g.by) / g.cell);
    return (c >= 0 && c < COLS && r >= 0 && r < ROWS) ? { r, c } : null;
  }
  function key(r, c) { return r * COLS + c; }
  function rr(x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);

  const easeInOut = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

  // ---- board setup ----
  function newGem(t) { return { t, sp: 0, dy: 0, vy: 0, die: -1, die0: 0, sq: 0, born: 0, boomed: false }; }
  function randType() { return Math.floor(Math.random() * TYPES.length); }
  function wouldMatch(r, c, t) {
    if (c >= 2 && board[r][c-1] && board[r][c-2] && board[r][c-1].t === t && board[r][c-2].t === t) return true;
    if (r >= 2 && board[r-1][c] && board[r-2][c] && board[r-1][c].t === t && board[r-2][c].t === t) return true;
    return false;
  }
  function fillBoard() {
    for (let guard = 0; guard < 50; guard++) {

        for (let c = 0; c < COLS; c++) {
          let t;
          do { t = randType(); } while (wouldMatch(r, c, t));
          board[r].push(newGem(t));
        }
      }
      if (findMove()) return;
    }
  }

  // ---- match detection ----
  function findRuns() {
    const runs = [];
    for (let r = 0; r < ROWS; r++) {
      let c = 0;
      while (c < COLS) {
        const g0 = board[r][c];
        if (!g0 || g0.t < 0) { c++; continue; }
        let len = 1;
        while (c + len < COLS && board[r][c+len] && board[r][c+len].t === g0.t) len++;
        if (len >= 3) runs.push({ r, c, len, h: true });
        c += len;
      }
    }
    for (let c = 0; c < COLS; c++) {
      let r = 0;
      while (r < ROWS) {
        const g0 = board[r][c];
        if (!g0 || g0.t < 0) { r++; continue; }
        let len = 1;
        while (r + len < ROWS && board[r+len][c] && board[r+len][c].t === g0.t) len++;
        if (len >= 3) runs.push({ r, c, len, h: false });
        r += len;
      }
    }
    return runs;
  }
  function runAt(r, c) {
    const t = board[r][c].t;
    if (t < 0) return false;
    let n = 1;
    for (let cc = c-1; cc >= 0 && board[r][cc] && board[r][cc].t === t; cc--) n++;
    for (let cc = c+1; cc < COLS && board[r][cc] && board[r][cc].t === t; cc++) n++;
    if (n >= 3) return true;
    n = 1;
    for (let rw = r-1; rw >= 0 && board[rw][c] && board[rw][c].t === t; rw--) n++;
    for (let rw = r+1; rw < ROWS && board[rw][c] && board[rw][c].t === t; rw++) n++;
    return n >= 3;
  }
  function findMove() {
    const moves = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const a = board[r][c];
      if (!a) continue;
      for (const d of [[0,1],[1,0]]) {
        const r2 = r + d[0], c2 = c + d[1];
        if (r2 >= ROWS || c2 >= COLS) continue;
        const b = board[r2][c2];
        if (!b) continue;
        if (a.t < 0 || b.t < 0) { moves.push([{r,c},{r:r2,c:c2}]); continue; }
        board[r][c] = b; board[r2][c2] = a;
        const ok = runAt(r, c) || runAt(r2, c2);
        board[r][c] = a; board[r2][c2] = b;
        if (ok) moves.push([{r,c},{r:r2,c:c2}]);

    return moves.length ? moves[Math.floor(Math.random() * moves.length)] : null;

  function pickSpot(run, swapCells) {
    if (swapCells) {
      for (const scc of swapCells) {
        for (let i = 0; i < run.len; i++) {
          const r = run.h ? run.r : run.r + i;
          const c = run.h ? run.c + i : run.c;
          if (scc.r === r && scc.c === c) return key(r, c);
        }
      }
    }
    const mid = Math.floor(run.len / 2);
    return run.h ? key(run.r, run.c + mid) : key(run.r + mid, run.c);
  }

  function resolveMatches(swapCells) {
    const runs = findRuns();
    if (!runs.length) return false;
    const clear = new Set();
    const cellRuns = new Map();
    for (const run of runs) {
      for (let i = 0; i < run.len; i++) {
        const r = run.h ? run.r : run.r + i;
        const c = run.h ? run.c + i : run.c;
        const k = key(r, c);
        clear.add(k);
        if (!cellRuns.has(k)) cellRuns.set(k, []);
        cellRuns.get(k).push(run);
      }
    }
    const create = new Map();
    for (const run of runs) if (run.len >= 5) create.set(pickSpot(run, swapCells), SP.PRISM);
    for (const [k, rs] of cellRuns)
      if (rs.length >= 2 && !create.has(k) && rs.every(q => q.len < 5)) create.set(k, SP.CROSS);
    for (const run of runs) {
      if (run.len === 4) {
        const k = pickSpot(run, swapCells);
        if (!create.has(k)) create.set(k, SP.FLAME);
      }
    }
    startClear(clear, create);
    return true;
  }

        for (let rw = r-1; rw <= r+1; rw++) for (let cc = c-1; cc <= c+1; cc++)

      gem.die = gem.die0;
      n++;
      const cx = g.bx + (c + .5) * g.cell, cy = g.by + (r + .5) * g.cell + gem.dy;
      sx += cx; sy += cy;
      gemBurst(cx, cy, gem.t >= 0 ? TYPES[gem.t].c : '#fff');
    }
    if (!n) { applyGravity(g); return; }

    const pts = n * 10 * cascade;
    score += pts; roundScore += pts;
    pops.push({ x: sx / n, y: sy / n, txt: '+' + pts, c: cascade > 1 ? NEON_YELLOW : '#fff',
      life: .9, big: cascade > 1 });
    if (cascade >= 2) toast('COMBO x' + cascade);
    sndPop(cascade * 2 + Math.min(Math.floor(n / 3), 4));
    updateHUD();

    for (const [k, sp] of create) {
      const r = Math.floor(k / COLS), c = k % COLS;
      const gem = board[r][c];
      if (!gem) continue;
      gem.die = -1; gem.die0 = 0;
      gem.sp = sp;
      if (sp === SP.PRISM) gem.t = -1;
      gem.born = .35;
      gem.boomed = false;
      const cx = g.bx + (c + .5) * g.cell, cy = g.by + (r + .5) * g.cell;
      rings.push({ x: cx, y: cy, r: g.cell * .2, vr: g.cell * 5, life: .35, c: '#fff' });
      pops.push({ x: cx, y: cy - g.cell * .6,
        txt: sp === SP.PRISM ? 'PRISM!' : sp === SP.FLAME ? 'FLAME!' : 'STORM!',
        c: NEON_YELLOW, life: 1, big: true });
      sndCoin();
    }

    clearT = CLEAR_T;
    state = S.CLEAR;
  }

  function gemBurst(x, y, col) {
    for (let i = 0; i < 9; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 170;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50,
        life: .35 + Math.random() * .35, size: 2 + Math.floor(Math.random() * 3),
        color: Math.random() < .25 ? '#fff' : col });
    }
  }

  function applyGravity(g) {
    for (let c = 0; c < COLS; c++) {
      let write = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        const gem = board[r][c];
        if (!gem) continue;
        if (write !== r) {
          gem.dy += (r - write) * g.cell;
          gem.vy = 0;
          board[write][c] = gem;
          board[r][c] = null;
        }
        write--;
      }
      const empty = write + 1;
      for (let r = write; r >= 0; r--) {
        const gem = newGem(randType());
        gem.dy = -empty * g.cell;
        board[r][c] = gem;
      }
    }
    state = S.FALL;
  }

  // ---- swapping ----
  function trySwap(a, b) {
    if (state !== S.IDLE) return;
    const ga = board[a.r][a.c], gb = board[b.r][b.c];
    if (!ga || !gb) return;
    sel = null; hint = null; idleT = 0;
    sndSwap();
    board[a.r][a.c] = gb; board[b.r][b.c] = ga;
    swp = { a, b, t: 0, back: false };
    state = S.SWAP;
  }

  function prismSwap(a, b) {
    const ga = board[a.r][a.c], gb = board[b.r][b.c];
    const g = geom();
    const clear = new Set();
    cascade = 1;
    if (ga.t < 0 && gb.t < 0) {
      ga.boomed = gb.boomed = true;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) clear.add(key(r, c));
      toast('TOTAL GLAM!');
      flash = .5;
    } else {
      const prismCell = ga.t < 0 ? a : b;
      const tt = ga.t < 0 ? gb.t : ga.t;
      board[prismCell.r][prismCell.c].boomed = true;
      clear.add(key(prismCell.r, prismCell.c));
      const px = g.bx + (prismCell.c + .5) * g.cell, py = g.by + (prismCell.r + .5) * g.cell;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const g2 = board[r][c];
        if (g2 && g2.t === tt) {
          clear.add(key(r, c));
          beams.push({ x1: px, y1: py, x2: g.bx + (c + .5) * g.cell, y2: g.by + (r + .5) * g.cell,
            life: .4, hue: TYPES[tt].hue });
        }
      }
    }
    sndPrism();
    shake = Math.max(shake, 10);
    rings.push({ x: g.bx + (a.c + .5) * g.cell, y: g.by + (a.r + .5) * g.cell,
      r: g.cell * .3, vr: g.cell * 12, life: .45, c: '#fff' });
    startClear(clear, new Map());
  }

  // ---- shuffle ----
  function startShuffle() {
    state = S.SHUFFLE;
    shuffleT = 1; shuffleMid = false;
    toast('NO MOVES!\nRESHUFFLE');
    sndClear();
  }
  function scramble() {
    let guard = 0;
    do {
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const gem = board[r][c];
        if (!gem || gem.t < 0) continue;
        do { gem.t = randType(); } while (wouldMatch(r, c, gem.t));
      }
    } while (!findMove() && ++guard < 60);
  }

  // ---- rounds ----
  function target() { return ROUNDS[round - 1].target; }
  function updateHUD() {
    hudVal(0, Math.max(0, target() - roundScore));
    hudVal(1, round + '/3');
    hudVal(2, String(score).padStart(6, '0'));
  }
  function setupRound(n) {
    const c = ROUNDS[n - 1];
    roundScore = 0;
    timeLeft = c.time; timeTotal = c.time; lastWholeSec = c.time;
    sel = null; drag = null; swp = null; hint = null; idleT = 0; cascade = 1;
    fillBoard();
    const g = geom();
    for (let r = 0; r < ROWS; r++) for (let c2 = 0; c2 < COLS; c2++)
      board[r][c2].dy = -(ROWS + 1) * g.cell;
    updateHUD();
    state = S.FALL;
  }

  function roundClear() {
    const bonus = Math.floor(timeLeft);
    score += bonus;
    updateHUD();
    if (round >= 3) { win(); return; }
    state = S.LEVELUP; sndClear();
    burst(W/2, H*0.4, NEON_PINK);
    burst(W/2, H*0.4, NEON_YELLOW);
    toast(bonus > 0 ? `ROUND CLEAR!\nTIME BONUS +${bonus}` : 'ROUND CLEAR!');
    later(() => { setupRound(++round);
      toast(round === 2 ? 'BIGGER GOAL!' : 'FINAL ROUND!'); }, 1400);
  }

  function win() {
    state = S.WIN; sndVictory();
    G.best = Math.max(G.best, score);
    for (let i = 0; i < 10; i++)
      later(() => launchFirework(), 200 + i * 320);
    later(() => {
      showEnd({ title: 'YOU WIN!', sub: 'ALL 3 ROUNDS CLEARED',
        stats: `SCORE ${String(score).padStart(6,'0')}<br>HI&nbsp;&nbsp;&nbsp; ${String(G.best).padStart(6,'0')}`,
        btn: 'PLAY AGAIN' });
    }, 3600);
  }

  function die() {
    state = S.DEAD; sndFail(); flash = 1;
    G.best = Math.max(G.best, score);
    later(() => {
      showEnd({ title: 'GAME OVER', sub: 'TIME UP!',
        stats: `SCORE ${String(score).padStart(6,'0')}<br>HI&nbsp;&nbsp;&nbsp; ${String(G.best).padStart(6,'0')}<br>ROUND ${round}/3`,
        btn: 'CONTINUE?' });
    }, 900);
  }

  // ---- drawing ----
  function gemPath(d, R) {
    ctx.beginPath();
    if (d === 'heart') {
      ctx.moveTo(0, R * .9);
      ctx.bezierCurveTo(-R * 1.05, R * .1, -R * .8, -R * .95, 0, -R * .38);
      ctx.bezierCurveTo(R * .8, -R * .95, R * 1.05, R * .1, 0, R * .9);
    } else if (d === 'gem') {
      ctx.moveTo(-R * .55, -R * .8); ctx.lineTo(R * .55, -R * .8);
      ctx.lineTo(R * .95, -R * .15); ctx.lineTo(0, R * .95); ctx.lineTo(-R * .95, -R * .15);
      ctx.closePath();
    } else if (d === 'star') {
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rd = i % 2 ? R * .48 : R;
        i ? ctx.lineTo(Math.cos(a) * rd, Math.sin(a) * rd) : ctx.moveTo(Math.cos(a) * rd, Math.sin(a) * rd);
      }
      ctx.closePath();
    } else if (d === 'hex') {
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 6 + i * Math.PI / 3;
        i ? ctx.lineTo(Math.cos(a) * R * .95, Math.sin(a) * R * .95)
          : ctx.moveTo(Math.cos(a) * R * .95, Math.sin(a) * R * .95);
      }
      ctx.closePath();
    } else if (d === 'tri') {
      ctx.moveTo(0, -R); ctx.lineTo(R * .92, R * .68); ctx.lineTo(-R * .92, R * .68);
      ctx.closePath();
    } else {
      ctx.arc(0, 0, R * .88, 0, Math.PI * 2);
    }
  }

  function drawGem(gem, cx, cy, cell, isSel, isHint) {
    let sc = 1, al = 1;
    if (gem.die >= 0) {
      const f = Math.max(0, gem.die / (gem.die0 || CLEAR_T));
      sc = f; al = f;
    }
    if (gem.born > 0) sc *= 1 + Math.sin((1 - gem.born / .35) * Math.PI) * .35;
    if (isSel) sc *= 1.06 + .06 * Math.sin(time * 9);
    const R = cell * .37 * sc;
    if (R < .5) return;
    ctx.save();
    ctx.translate(cx, cy);
    if (gem.sq > 0) ctx.scale(1 + gem.sq * .35, 1 - gem.sq * .45);
    ctx.globalAlpha = al;

    if (gem.t < 0) {
      // prism — hue-cycling orb
      const hue = (time * 140) % 360;
      const grd = ctx.createRadialGradient(0, 0, R * .1, 0, 0, R);
      grd.addColorStop(0, '#fff');
      grd.addColorStop(.5, `hsl(${hue},100%,65%)`);
      grd.addColorStop(1, `hsl(${(hue + 120) % 360},100%,45%)`);
      ctx.shadowColor = `hsl(${hue},100%,65%)`; ctx.shadowBlur = 18;
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0, 0, R * .92, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, R * .92, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      for (let i = 0; i < 3; i++) {
        const a = time * 3 + i * Math.PI * 2 / 3;
        ctx.fillRect(Math.cos(a) * R * .72 - 1.5, Math.sin(a) * R * .72 - 1.5, 3, 3);
      }
    } else {
      const T = TYPES[gem.t];
      if (gem.sp === SP.FLAME) {
        const fl = .7 + .3 * Math.sin(time * 12 + cx * .1);
        ctx.fillStyle = `rgba(255,140,43,${.3 * fl})`;
        ctx.beginPath(); ctx.arc(0, 0, R * 1.45 * fl, 0, Math.PI * 2); ctx.fill();
      }
      const grd = ctx.createRadialGradient(-R * .35, -R * .4, R * .12, 0, 0, R * 1.15);
      grd.addColorStop(0, 'rgba(255,255,255,.95)');
      grd.addColorStop(.32, T.c);
      grd.addColorStop(1, T.dk);
      ctx.fillStyle = grd;
      ctx.shadowColor = T.c; ctx.shadowBlur = (isSel || isHint) ? 20 : 10;
      gemPath(T.d, R);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(-R * .3, -R * .4, R * .18, R * .1, -.6, 0, Math.PI * 2); ctx.fill();
      if (gem.sp === SP.CROSS) {
        const a2 = .45 + .35 * Math.sin(time * 8 + cy * .1);
        ctx.strokeStyle = `rgba(255,255,255,${a2})`;
        ctx.shadowColor = NEON_CYAN; ctx.shadowBlur = 8;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-R * 1.35, 0); ctx.lineTo(R * 1.35, 0);
        ctx.moveTo(0, -R * 1.35); ctx.lineTo(0, R * 1.35);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = `rgba(255,255,255,${a2})`;
        ctx.beginPath(); ctx.arc(0, 0, R * .18, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawFrame(g) {
    const bw = g.cell * COLS, bh = g.cell * ROWS;
    ctx.fillStyle = 'rgba(8,6,24,.82)';
    rr(g.bx - 8, g.by - 8, bw + 16, bh + 16, 10); ctx.fill();
    ctx.strokeStyle = NEON_PINK; ctx.lineWidth = 2;
    ctx.shadowColor = NEON_PINK; ctx.shadowBlur = 14;
    rr(g.bx - 8, g.by - 8, bw + 16, bh + 16, 10); ctx.stroke();
    ctx.shadowBlur = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 ? 'rgba(255,45,149,.05)' : 'rgba(34,230,255,.05)';
      ctx.fillRect(g.bx + c * g.cell + 1, g.by + r * g.cell + 1, g.cell - 2, g.cell - 2);
    }
  }

  function drawBars(g) {
    const bw = g.cell * COLS;
    // time bar above the board
    const frac = Math.max(0, Math.min(1, timeLeft / timeTotal));
    const low = timeLeft <= 10;
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    rr(g.bx, g.by - 20, bw, 8, 4); ctx.fill();
    if (frac > 0) {
      const col = low ? '#ff3355' : NEON_CYAN;
      ctx.fillStyle = col;
      ctx.shadowColor = col; ctx.shadowBlur = low ? 12 + Math.sin(time * 10) * 4 : 8;
      rr(g.bx, g.by - 20, Math.max(6, bw * frac), 8, 4); ctx.fill();
      ctx.shadowBlur = 0;
    }
    // goal bar below the board
    const gy = g.by + g.cell * ROWS + 12;
    const gf = Math.min(1, roundScore / target());
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    rr(g.bx, gy, bw, 8, 4); ctx.fill();
    if (gf > 0) {
      ctx.fillStyle = NEON_YELLOW;
      ctx.shadowColor = NEON_YELLOW;
      ctx.shadowBlur = gf >= 1 ? 14 + Math.sin(time * 10) * 5 : 8;
      rr(g.bx, gy, Math.max(6, bw * gf), 8, 4); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawFX(dt) {
    rings = rings.filter(q => (q.life -= dt) > 0);
    for (const q of rings) {
      q.r += q.vr * dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, q.life / .3));
      ctx.strokeStyle = q.c; ctx.lineWidth = 3;
      ctx.shadowColor = q.c; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    bolts = bolts.filter(b => (b.life -= dt) > 0);
    for (const b of bolts) {
      const a = Math.max(0, b.life / .32);
      ctx.strokeStyle = `rgba(255,255,255,${a})`;
      ctx.shadowColor = NEON_CYAN; ctx.shadowBlur = 14;
      ctx.lineWidth = 2.5;
      const dx = b.x2 - b.x1, dyl = b.y2 - b.y1;
      const len = Math.hypot(dx, dyl) || 1, nx = -dyl / len, ny = dx / len;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1);
      for (let i = 1; i < 9; i++) {
        const t = i / 9, off = (Math.random() - .5) * 16;
        ctx.lineTo(b.x1 + dx * t + nx * off, b.y1 + dyl * t + ny * off);
      }
      ctx.lineTo(b.x2, b.y2); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    beams = beams.filter(b => (b.life -= dt) > 0);
    for (const b of beams) {
      const a = Math.max(0, b.life / .4);
      ctx.strokeStyle = `hsla(${b.hue},100%,70%,${a})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = `hsl(${b.hue},100%,70%)`; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  function drawPops(dt) {
    pops = pops.filter(p => (p.life -= dt) > 0);
    for (const p of pops) {
      p.y -= 42 * dt;
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.font = `${p.big ? 13 : 10}px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = p.c;
      ctx.shadowColor = p.c; ctx.shadowBlur = 8;
      ctx.fillText(p.txt, p.x, p.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  function cellOutline(g, cell2, col, alpha) {
    const px = g.bx + cell2.c * g.cell, py = g.by + cell2.r * g.cell;
    ctx.strokeStyle = col;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 2;
    ctx.shadowColor = col; ctx.shadowBlur = 10;
    rr(px + 2, py + 2, g.cell - 4, g.cell - 4, 8); ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // ---- input ----
  G.tap = function (cx, cy) {
    if (cx === undefined) {
      // keyboard: play a valid move automatically
      if (state !== S.IDLE) return;
      const mv = hint || findMove();
      if (mv) trySwap(mv[0], mv[1]);
      return;
    }
    if (state !== S.IDLE) return;
    const cell2 = cellAt(cx, cy);
    if (!cell2) { sel = null; return; }
    drag = { x: cx, y: cy, cell: cell2 };
    idleT = 0; hint = null;
    if (sel && Math.abs(sel.r - cell2.r) + Math.abs(sel.c - cell2.c) === 1) {
      trySwap(sel, cell2);
      drag = null;
    } else if (sel && sel.r === cell2.r && sel.c === cell2.c) {
      sel = null;
    } else {
      sel = cell2;
      beep(660, .04, 'square', .05);
    }
  };
  G.move = function (cx, cy) {
    if (!drag || state !== S.IDLE) return;
    const g = geom();
    const dx = cx - drag.x, dy = cy - drag.y;
    if (Math.hypot(dx, dy) < g.cell * .35) return;
    const dir = Math.abs(dx) > Math.abs(dy) ? { r: 0, c: dx > 0 ? 1 : -1 } : { r: dy > 0 ? 1 : -1, c: 0 };
    const to = { r: drag.cell.r + dir.r, c: drag.cell.c + dir.c };
    if (to.r >= 0 && to.r < ROWS && to.c >= 0 && to.c < COLS) trySwap(drag.cell, to);
    drag = null;
  };
  G.up = function () { drag = null; };

  // ---- lifecycle ----
  G.start = function () {
    setHUD(['GOAL', 'ROUND', 'SCORE']);
    round = 1; score = 0;
    pops = []; rings = []; bolts = []; beams = [];
    shake = 0; flash = 0; landSndT = 0;
    resetFX();
    setupRound(1);
  };

  G.frame = function (dt) {
    time += dt;
    shake = Math.max(0, shake - dt * 30);
    flash = Math.max(0, flash - dt * 2.5);
    landSndT = Math.max(0, landSndT - dt);
    const g = geom();

    const playing = state === S.IDLE || state === S.SWAP || state === S.CLEAR || state === S.FALL;
    if (playing) {
      timeLeft -= dt;
      const whole = Math.ceil(timeLeft);
      if (whole !== lastWholeSec && whole <= 5 && whole > 0) { sndTick(); lastWholeSec = whole; }
      if (timeLeft <= 0) { timeLeft = 0; die(); }
    }

    // per-gem timers + flame embers
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const gem = board[r][c];
      if (!gem) continue;
      if (gem.born > 0) gem.born = Math.max(0, gem.born - dt);
      if (gem.sq > 0) gem.sq = Math.max(0, gem.sq - dt * 4);
      if (gem.die >= 0) gem.die = Math.max(0, gem.die - dt);
      if (gem.sp === SP.FLAME && gem.die < 0 && Math.random() < dt * 6) {
        particles.push({ x: g.bx + (c + .5) * g.cell + (Math.random() - .5) * g.cell * .5,
          y: g.by + (r + .5) * g.cell + gem.dy,
          vx: (Math.random() - .5) * 30, vy: -60 - Math.random() * 60,
          life: .4 + Math.random() * .3, size: 2,
          color: Math.random() < .5 ? '#ff8c2b' : '#ffe94a' });
      }
    }

    // state machine
    if (state === S.SWAP && swp) {
      swp.t += dt / SWAP_T;
      if (swp.t >= 1) {
        if (swp.back) { swp = null; state = S.IDLE; idleT = 0; }
        else {
          const ga = board[swp.a.r][swp.a.c], gb = board[swp.b.r][swp.b.c];
          if (ga.t < 0 || gb.t < 0) {
            const a = swp.a, b = swp.b;
            swp = null;
            prismSwap(a, b);
          } else {
            cascade = 1;
            if (resolveMatches([swp.a, swp.b])) swp = null;
            else {
              sndBad(); shake = Math.max(shake, 4);
              const tmp = board[swp.a.r][swp.a.c];
              board[swp.a.r][swp.a.c] = board[swp.b.r][swp.b.c];
              board[swp.b.r][swp.b.c] = tmp;
              swp.back = true; swp.t = 0;
            }
          }
        }
      }
    } else if (state === S.CLEAR) {
      clearT -= dt;
      if (clearT <= 0) {
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          const gem = board[r][c];
          if (gem && gem.die >= 0) board[r][c] = null;
        }
        applyGravity(g);
      }
    } else if (state === S.FALL) {
      let falling = false;
      for (let c = 0; c < COLS; c++) for (let r = ROWS - 1; r >= 0; r--) {
        const gem = board[r][c];
        if (!gem || gem.dy >= 0) continue;
        gem.vy += GRAV * dt;
        gem.dy += gem.vy * dt;
        if (gem.dy >= 0) {
          gem.dy = 0; gem.vy = 0; gem.sq = .35;
          if (landSndT <= 0) { sndLand(); landSndT = .06; }
        } else falling = true;
      }
      if (!falling) {
        cascade++;
        if (!resolveMatches(null)) {
          cascade = 1;
          if (roundScore >= target()) roundClear();
          else if (!findMove()) startShuffle();
          else { state = S.IDLE; idleT = 0; hint = null; }
        }
      }
    } else if (state === S.SHUFFLE) {
      shuffleT -= dt;
      if (!shuffleMid && shuffleT <= .5) { shuffleMid = true; scramble(); }
      if (shuffleT <= 0) { state = S.IDLE; idleT = 0; hint = null; }
    } else if (state === S.IDLE) {
      idleT += dt;
      if (idleT > 5 && !hint) hint = findMove();
    }

    // ---- draw ----
    drawArcadeBG(time);
    const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
    ctx.save();
    ctx.translate(sx, sy);
    drawFrame(g);
    drawBars(g);

    ctx.save();
    ctx.beginPath();
    ctx.rect(g.bx - 4, g.by - 4, g.cell * COLS + 8, g.cell * ROWS + 8);
    ctx.clip();
    const shufSc = state === S.SHUFFLE ? Math.abs(shuffleT * 2 - 1) : 1;
    const e = swp ? easeInOut(Math.min(1, swp.t)) : 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const gem = board[r][c];
      if (!gem) continue;
      if (swp && ((r === swp.a.r && c === swp.a.c) || (r === swp.b.r && c === swp.b.c))) continue;
      const isSel = sel && sel.r === r && sel.c === c;
      const isHint = hint && state === S.IDLE && idleT > 5 &&
        hint.some(h => h.r === r && h.c === c);
      drawGem(gem, g.bx + (c + .5) * g.cell, g.by + (r + .5) * g.cell + gem.dy,
        g.cell * shufSc, isSel, isHint);
    }
    if (swp) {
      // swapping pair drawn on top, gliding between cells
      for (const [self, other] of [[swp.a, swp.b], [swp.b, swp.a]]) {
        const gem = board[self.r][self.c];
        if (!gem) continue;
        const ox = (other.c - self.c) * g.cell * (1 - e);
        const oy = (other.r - self.r) * g.cell * (1 - e);
        drawGem(gem, g.bx + (self.c + .5) * g.cell + ox,
          g.by + (self.r + .5) * g.cell + gem.dy + oy, g.cell, false, false);
      }
    }
    ctx.restore();

    if (sel && state === S.IDLE)
      cellOutline(g, sel, '#fff', .55 + .35 * Math.sin(time * 9));
    if (hint && state === S.IDLE && idleT > 5)
      for (const h of hint) cellOutline(g, h, NEON_CYAN, .35 + .3 * Math.sin(time * 6));

    drawFX(dt);
    ctx.restore();

    drawPops(dt);
    drawParticles(dt);
    updateFireworks(dt);

    if (flash > 0) {
      ctx.fillStyle = state === S.DEAD ? `rgba(255,51,85,${flash * .35})` : `rgba(255,255,255,${flash * .3})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === S.IDLE) {
      ctx.font = `9px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = (Math.floor(time * 2) % 2) ? 'rgba(34,230,255,.7)' : 'rgba(34,230,255,.25)';
      ctx.fillText('SWIPE OR TAP TO SWAP', W/2, H - 24);
    }
  };

  G.retry = G.start;
  return G;
})();

// ============================================================
//  GAME 5: GLITTER DARTS
// ============================================================
const GameDarts = (() => {
  const S = { PLAY:1, THROW:2, LEVELUP:3, DEAD:4 };
  const RINGS = [
    { f:0.15, pts:50, col:NEON_YELLOW },
    { f:0.36, pts:30, col:NEON_PINK },
    { f:0.60, pts:20, col:'#b44dff' },
    { f:0.82, pts:10, col:NEON_CYAN },
    { f:1.00, pts:5,  col:'#ff7ab8' },
  ];
  let state, level, score, dartsLeft, needLeft, needTotal;
  let dart, stuck, misses, floats, aimP1, aimP2, shake, flash;
  let time = 0;

  const G = { name: 'GLITTER DARTS', best: 0 };

  const sndThrow = () => { beep(520, .05, 'square', .07); setTimeout(()=>beep(760,.04,'square',.05), 40); };
  const sndStick = () => { beep(180, .06, 'square', .12); beep(880, .05, 'square', .05); };
  const sndBull  = () => { [880,1175,1568].forEach((f,i)=>setTimeout(()=>beep(f,.1,'square',.1), i*70)); };
  const sndMiss  = () => { beep(150, .12, 'square', .09); };

  // difficulty curve: faster aim, shrinking board, then the board starts to drift
  function cfg() {
    return {
      darts: 5,
      need: Math.min(40 + (level - 1) * 15, 180),
      spd: Math.min(1 + (level - 1) * 0.22, 3.2),
      scale: 1 - Math.min(0.30, (level - 1) * 0.035),
      driftAX: level >= 3 ? Math.min(70, (level - 2) * 14) : 0,
      driftAY: level >= 6 ? Math.min(34, (level - 5) * 8) : 0,
      driftS: 0.8 + level * 0.08,
    };
  }
  function boardGeom() {
    const c = cfg();
    const base = Math.min(W * 0.36, H * 0.20, 150);
    return {
      cx: W/2 + Math.sin(time * c.driftS) * c.driftAX,
      cy: H * 0.30 + Math.cos(time * c.driftS * 0.9) * c.driftAY,
      R: Math.max(56, base * c.scale),
    };
  }
  // reticle sweeps a lissajous path slightly wider than the board
  function aimPos(g) {
    const c = cfg();
    return {
      x: g.cx + Math.sin(time * 1.9 * c.spd + aimP1) * g.R * 1.25,
      y: g.cy + Math.sin(time * 2.6 * c.spd + aimP2) * g.R * 1.05,
    };
  }

  function setupLevel() {
    const c = cfg();
    stuck = []; dart = null;
    dartsLeft = c.darts;
    needTotal = needLeft = c.need;
    aimP1 = Math.random() * Math.PI * 2;
    aimP2 = Math.random() * Math.PI * 2;
    updateHUD();
  }
  function updateHUD() {
    hudVal(0, dartsLeft);
    hudVal(1, level);
    hudVal(2, String(score).padStart(6, '0'));
  }

  function drawDart(x, y, ang, s, glow, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang || 0);
    ctx.scale(s, s);
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    if (glow) { ctx.shadowColor = NEON_PINK; ctx.shadowBlur = 12; }
    ctx.fillStyle = '#e8e8ff';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-3, 9); ctx.lineTo(3, 9);
    ctx.closePath(); ctx.fill();
    const grd = ctx.createLinearGradient(-3, 0, 3, 0);
    grd.addColorStop(0, '#ff7ab8'); grd.addColorStop(.5, NEON_PINK); grd.addColorStop(1, '#c2185b');
    ctx.fillStyle = grd;
    ctx.fillRect(-3, 9, 6, 24);
    ctx.shadowBlur = 0;
    ctx.fillStyle = NEON_CYAN;
    ctx.fillRect(-3, 19, 6, 3);
    ctx.fillStyle = NEON_YELLOW;
    ctx.beginPath();
    ctx.moveTo(-2, 33); ctx.lineTo(-9, 45); ctx.lineTo(-2, 42); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(2, 33); ctx.lineTo(9, 45); ctx.lineTo(2, 42); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-1, 33, 2, 10);
    ctx.restore();
  }

  function drawBoard(g) {
    const sx = (Math.random()-.5) * shake, sy = (Math.random()-.5) * shake;
    ctx.save();
    ctx.translate(g.cx + sx, g.cy + sy);
    ctx.beginPath(); ctx.arc(0, 0, g.R * 1.32, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,45,149,.05)'; ctx.fill();
    for (let i = RINGS.length - 1; i >= 0; i--) {
      const r = RINGS[i];
      ctx.beginPath(); ctx.arc(0, 0, g.R * r.f, 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? '#0d0b1e' : '#1a0f2e';
      ctx.fill();
      ctx.strokeStyle = r.col;
      ctx.lineWidth = i === RINGS.length - 1 ? 4 : 2;
      if (i === RINGS.length - 1) { ctx.shadowColor = r.col; ctx.shadowBlur = 18; }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.strokeStyle = 'rgba(34,230,255,.25)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * g.R * 0.15, Math.sin(a) * g.R * 0.15);
      ctx.lineTo(Math.cos(a) * g.R, Math.sin(a) * g.R);
      ctx.stroke();
    }
    ctx.font = `7px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 1; i < RINGS.length; i++) {
      const mid = (RINGS[i-1].f + RINGS[i].f) / 2;
      ctx.fillStyle = RINGS[i].col;
      ctx.fillText(RINGS[i].pts, 0, -g.R * mid);
    }
    ctx.font = `${Math.round(g.R * 0.16)}px serif`;
    ctx.fillText('✨', 0, 1);
    ctx.restore();

    if (state === S.PLAY || state === S.THROW) {
      const y = g.cy + g.R + 30;
      ctx.font = `10px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = NEON_CYAN; ctx.shadowColor = NEON_CYAN; ctx.shadowBlur = 8;
      ctx.fillText('NEED ' + needLeft, g.cx, y);
      ctx.shadowBlur = 0;
      const bw = g.R * 1.6;
      ctx.fillStyle = 'rgba(34,230,255,.15)';
      ctx.fillRect(g.cx - bw/2, y + 10, bw, 6);
      ctx.fillStyle = NEON_YELLOW;
      ctx.fillRect(g.cx - bw/2, y + 10, bw * (1 - needLeft / needTotal), 6);
    }
  }

  function drawAim(a) {
    const p = 3 + Math.sin(time * 6) * 1.5;
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.shadowColor = NEON_CYAN; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0, 0, 12 + p, 0, Math.PI*2); ctx.stroke();
    ctx.rotate(time * 2);
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, 16 + p); ctx.lineTo(0, 22 + p); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = NEON_PINK;
    ctx.fillRect(-2, -2, 4, 4);
    ctx.restore();
  }

  function throwDart() {
    if (state !== S.PLAY || dartsLeft <= 0) return;
    const a = aimPos(boardGeom());
    const sx = W/2, sy = H * 0.88;
    dart = { sx, sy, tx: a.x, ty: a.y, t: 0,
      dur: 0.14 + Math.hypot(a.x - sx, a.y - sy) / 2800 };
    state = S.THROW;
    sndThrow();
  }

  function land(g) {
    const d = Math.hypot(dart.tx - g.cx, dart.ty - g.cy) / g.R;
    let ring = null;
    for (const r of RINGS) if (d <= r.f) { ring = r; break; }
    dartsLeft--;
    if (ring) {
      score += ring.pts;
      needLeft = Math.max(0, needLeft - ring.pts);
      stuck.push({ dx: dart.tx - g.cx, dy: dart.ty - g.cy, ang: (Math.random()-.5)*.24 });
      shake = 6;
      if (ring.pts === 50) {
        sndBull();
        burst(dart.tx, dart.ty, NEON_YELLOW); burst(dart.tx, dart.ty, NEON_PINK);
        toast('BULLSEYE! +50');
      } else {
        sndStick();
        floats.push({ x: dart.tx, y: dart.ty - 16, txt: '+' + ring.pts, life: .8, col: ring.col });
      }
    } else {
      sndMiss();
      misses.push({ x: dart.tx, y: dart.ty, vy: -120, vr: (Math.random()-.5)*10, r: 0 });
      floats.push({ x: dart.tx, y: dart.ty - 16, txt: 'MISS', life: .8, col: '#ff3355' });
    }
    dart = null;
    updateHUD();
    if (needLeft <= 0) levelClear();
    else if (dartsLeft <= 0) die();
    else state = S.PLAY;
  }

  function levelClear() {
    const bonus = dartsLeft * 5;
    score += bonus;
    G.best = Math.max(G.best, score);
    updateHUD();
    state = S.LEVELUP; sndClear();
    const g = boardGeom();
    burst(g.cx, g.cy, NEON_PINK); burst(g.cx, g.cy, NEON_YELLOW);
    toast(bonus > 0 ? `LEVEL ${level} CLEAR!\nDART BONUS +${bonus}` : `LEVEL ${level} CLEAR!`);
    if (level % 5 === 0) for (let k = 0; k < 4; k++) later(() => launchFirework(), k * 300);
    later(() => {
      level++;
      setupLevel();
      state = S.PLAY;
      toast(level === 2 ? 'FASTER AIM!' : level === 3 ? 'THE BOARD DRIFTS!'
        : level === 6 ? 'DOUBLE DRIFT!' : 'LEVEL ' + level);
    }, 1500);
  }

  function die() {
    state = S.DEAD; sndFail(); flash = 1;
    G.best = Math.max(G.best, score);
    later(() => {
      showEnd({ title: 'GAME OVER', sub: 'OUT OF DARTS!',
        stats: `SCORE ${String(score).padStart(6,'0')}<br>HI&nbsp;&nbsp;&nbsp; ${String(G.best).padStart(6,'0')}<br>LEVEL ${level}`,
        btn: 'CONTINUE?' });
    }, 900);
  }

  G.start = function() {
    setHUD(['DARTS', 'LEVEL', 'SCORE']);
    level = 1; score = 0; resetFX();
    misses = []; floats = []; shake = 0; flash = 0;
    setupLevel();
    state = S.PLAY;
  };

  G.tap = throwDart;

  G.frame = function(dt) {
    time += dt;
    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 3);

    drawArcadeBG(time);
    const g = boardGeom();
    drawBoard(g);

    for (const s of stuck) drawDart(g.cx + s.dx, g.cy + s.dy, s.ang, 0.8, false);

    misses = misses.filter(m => m.y < H + 80);
    for (const m of misses) {
      m.vy += 1500 * dt; m.y += m.vy * dt; m.r += m.vr * dt;
      drawDart(m.x, m.y, m.r, 0.9, false, .8);
    }

    if (state === S.THROW && dart) {
      dart.t += dt / dart.dur;
      if (dart.t >= 1) {
        land(g);
      } else {
        const e = dart.t;
        const x = dart.sx + (dart.tx - dart.sx) * e;
        const y = dart.sy + (dart.ty - dart.sy) * e;
        const ang = Math.atan2(dart.tx - dart.sx, dart.sy - dart.ty);
        drawDart(x, y, ang, 1.4 - e * 0.5, true);
      }
    }

    if (state === S.PLAY) {
      drawAim(aimPos(g));
      const bob = Math.sin(time * 3) * 4;
      drawDart(W/2, H * 0.88 + bob, 0, 1.5, true);
      ctx.fillStyle = NEON_CYAN;
      for (let i = 0; i < dartsLeft - 1; i++)
        ctx.fillRect(W/2 - ((dartsLeft-2)*10)/2 + i*10 - 2, H*0.88 + 78, 5, 5);
    }

    floats = floats.filter(f => (f.life -= dt) > 0);
    ctx.font = `10px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      f.y -= 46 * dt;
      ctx.globalAlpha = Math.min(1, f.life / .4);
      ctx.fillStyle = f.col;
      ctx.shadowColor = f.col; ctx.shadowBlur = 8;
      ctx.fillText(f.txt, f.x, f.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    drawParticles(dt);
    updateFireworks(dt);

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,51,85,${flash * .35})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === S.PLAY) {
      ctx.font = `9px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center';
      ctx.fillStyle = (Math.floor(time * 2) % 2) ? 'rgba(34,230,255,.7)' : 'rgba(34,230,255,.25)';
      ctx.fillText('TAP TO THROW', W/2, H - 24);
    }
  };

  G.retry = G.start;
  return G;
})();
