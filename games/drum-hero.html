<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DRUM HERO — ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#04040a; touch-action:none;
    font-family:'VT323',monospace; user-select:none; -webkit-user-select:none; }
  #game { display:block; width:100%; height:100%; }

  /* ---- CRT screen effect ---- */
  #crt { position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0px, rgba(0,0,0,.22) 1px, transparent 2px, transparent 4px);
    mix-blend-mode:multiply; }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:6;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,10,.55) 100%);
    animation:flicker 4s infinite; }
  @keyframes flicker {
    0%,100% { opacity:1; } 92% { opacity:1; } 93% { opacity:.86; } 94% { opacity:1; } 97% { opacity:.93; } 98% { opacity:1; }
  }
  @media (prefers-reduced-motion: reduce) { #vignette { animation:none; } .blink { animation:none !important; } #ov-title { animation:none !important; } }

  /* ---- HUD ---- */
  .hud { position:fixed; top:0; left:0; right:0; z-index:4; display:none;
    padding:calc(12px + env(safe-area-inset-top)) 16px 0;
    justify-content:space-between; align-items:flex-start; pointer-events:none; }
  body.playing .hud { display:flex; }
  .hud .label { font-family:'Press Start 2P',monospace; font-size:8px; letter-spacing:.1em;
    color:#22e6ff; text-shadow:0 0 6px rgba(34,230,255,.8); margin-bottom:6px; }
  .hud .value { font-family:'Press Start 2P',monospace; font-size:16px;
    color:#fff; text-shadow:0 0 8px rgba(255,45,149,.9), 0 0 2px #fff; }
  #hud2 { text-align:center; }
  #hud3 { text-align:right; }
  #hud3 .value { color:#ffe94a; text-shadow:0 0 8px rgba(255,233,74,.9); }

  /* ---- Overlay ---- */
  #overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:rgba(2,2,10,.88); color:#fff; text-align:center; padding:24px;
    overflow-y:auto; touch-action:pan-y;
    opacity:0; pointer-events:none; visibility:hidden;
    transition:opacity .3s ease, visibility 0s linear .3s; }
  #overlay.show { opacity:1; pointer-events:auto; visibility:visible; transition:opacity .3s ease; }
  #ov-title { font-family:'Press Start 2P',monospace; font-size:26px; line-height:1.6; margin-bottom:14px;
    color:#ff2d95; text-shadow:0 0 14px #ff2d95, 0 0 40px rgba(255,45,149,.6), 3px 3px 0 #33003a;
    animation:neon 2.4s infinite; }
  @keyframes neon {
    0%,100% { text-shadow:0 0 14px #ff2d95, 0 0 40px rgba(255,45,149,.6), 3px 3px 0 #33003a; }
    50% { text-shadow:0 0 22px #ff2d95, 0 0 60px rgba(255,45,149,.9), 3px 3px 0 #33003a; }
  }
  #ov-sub { font-family:'Press Start 2P',monospace; font-size:9px; line-height:2;
    color:#22e6ff; text-shadow:0 0 6px rgba(34,230,255,.8); margin-bottom:20px; max-width:340px; }
  #ov-stats { font-family:'Press Start 2P',monospace; font-size:11px; line-height:2.2;
    color:#ffe94a; text-shadow:0 0 8px rgba(255,233,74,.8); margin-bottom:22px; }
  #ov-stats:empty { display:none; }
  .arcade-btn { font-family:'Press Start 2P',monospace; font-size:12px;
    color:#04040a; background:#ffe94a; border:none; border-radius:4px; padding:16px 34px; cursor:pointer;
    box-shadow:0 0 18px rgba(255,233,74,.7), 0 5px 0 #a68f00; }
  .arcade-btn:active { transform:translateY(4px); box-shadow:0 0 18px rgba(255,233,74,.7), 0 1px 0 #a68f00; }
  #coin-line { font-family:'Press Start 2P',monospace; font-size:10px; color:#fff; margin-top:24px;
    text-shadow:0 0 8px rgba(255,255,255,.6); }
  .blink { animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  #toast { position:fixed; left:50%; top:36%; transform:translate(-50%,-50%); pointer-events:none; z-index:8;
    font-family:'Press Start 2P',monospace; font-size:15px; color:#ffe94a; text-align:center; line-height:1.8;
    text-shadow:0 0 12px rgba(255,233,74,.9), 2px 2px 0 #4a3a00; opacity:0; transition:opacity .2s, transform .45s; }
  #toast.show { opacity:1; transform:translate(-50%,-75%); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="crt"></div>
<div id="vignette"></div>

<div class="hud">
  <div id="hud1"><div class="label">COMBO</div><div class="value">-</div></div>
  <div id="hud2"><div class="label">LEVEL</div><div class="value">1</div></div>
  <div id="hud3"><div class="label">SCORE</div><div class="value">000000</div></div>
</div>

<div id="toast"></div>

<div id="overlay" class="show">
  <h1 id="ov-title">DRUM<br>HERO</h1>
  <div id="ov-sub">HIT THE PADS AS NOTES REACH THE LINE<br><br>
    KEYS D F J K &nbsp;(SPACE = KICK)<br>OR TAP THE LANES<br><br>
    KEEP THE GROOVE METER ALIVE.<br>EVERY LEVEL: FASTER + TRICKIER BEATS</div>
  <div id="ov-stats"></div>
  <button class="arcade-btn" id="ov-btn">START</button>
  <div id="coin-line" class="blink">INSERT COIN</div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const $ovTitle = document.getElementById('ov-title');
const $ovSub = document.getElementById('ov-sub');
const $ovStats = document.getElementById('ov-stats');
const $ovBtn = document.getElementById('ov-btn');
const $toast = document.getElementById('toast');
const hudEls = [1,2,3].map(i => document.getElementById('hud' + i).querySelector('.value'));

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const NEON_PINK = '#ff2d95', NEON_CYAN = '#22e6ff', NEON_YELLOW = '#ffe94a';

function toast(msg) {
  $toast.innerHTML = String(msg).replace('\n', '<br>');
  $toast.classList.add('show');
  setTimeout(() => $toast.classList.remove('show'), 1100);
}
function hudVal(i, v) { hudEls[i].textContent = v; }

// ============================================================
//  DRUM KIT — synthesized with Web Audio
// ============================================================
let AC = null, drumBus = null, noiseBuf = null;
function audio() {
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  if (!drumBus) {
    drumBus = AC.createDynamicsCompressor();
    drumBus.threshold.value = -14; drumBus.ratio.value = 6;
    drumBus.attack.value = 0.002; drumBus.release.value = 0.12;
    drumBus.connect(AC.destination);
  }
  if (!noiseBuf) {
    const len = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  return AC;
}
function noiseSrc() {
  const s = AC.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  s.start(AC.currentTime, Math.random() * 1.5);
  return s;
}
const vel = () => 0.85 + Math.random() * 0.3;   // humanizing velocity

function playKick() {
  try {
    audio();
    const t = AC.currentTime, v = vel();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(165, t);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.10);
    g.gain.setValueAtTime(1.0 * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
    o.connect(g); g.connect(drumBus);
    o.start(t); o.stop(t + 0.45);
    // beater click
    const n = noiseSrc(), hp = AC.createBiquadFilter(), ng = AC.createGain();
    hp.type = 'highpass'; hp.frequency.value = 1500;
    ng.gain.setValueAtTime(0.35 * v, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    n.connect(hp); hp.connect(ng); ng.connect(drumBus);
    n.stop(t + 0.05);
  } catch(e) {}
}
function playSnare() {
  try {
    audio();
    const t = AC.currentTime, v = vel();
    // drum body
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(196, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.08);
    g.gain.setValueAtTime(0.5 * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(drumBus);
    o.start(t); o.stop(t + 0.14);
    // snare wires
    const n = noiseSrc(), hp = AC.createBiquadFilter(), ng = AC.createGain();
    hp.type = 'highpass'; hp.frequency.value = 1600; hp.Q.value = 0.7;
    ng.gain.setValueAtTime(0.55 * v, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.20);
    n.connect(hp); hp.connect(ng); ng.connect(drumBus);
    n.stop(t + 0.22);
  } catch(e) {}
}
function playHat(open) {
  try {
    audio();
    const t = AC.currentTime, v = vel();
    const dur = open ? 0.45 : 0.06;
    // classic 808 hat: 6 detuned squares -> bandpass -> highpass
    const bp = AC.createBiquadFilter(), hp = AC.createBiquadFilter(), g = AC.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 10000;
    hp.type = 'highpass'; hp.frequency.value = 7500;
    g.gain.setValueAtTime(0.30 * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    bp.connect(hp); hp.connect(g); g.connect(drumBus);
    for (const f of [263, 400, 421, 474, 587, 845]) {
      const o = AC.createOscillator();
      o.type = 'square'; o.frequency.value = f;
      o.connect(bp); o.start(t); o.stop(t + dur + 0.02);
    }
  } catch(e) {}
}
function playTom() {
  try {
    audio();
    const t = AC.currentTime, v = vel();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(200, t);
    o.frequency.exponentialRampToValueAtTime(88, t + 0.22);
    g.gain.setValueAtTime(0.8 * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
    o.connect(g); g.connect(drumBus);
    o.start(t); o.stop(t + 0.36);
    const n = noiseSrc(), bp = AC.createBiquadFilter(), ng = AC.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 900;
    ng.gain.setValueAtTime(0.12 * v, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    n.connect(bp); bp.connect(ng); ng.connect(drumBus);
    n.stop(t + 0.08);
  } catch(e) {}
}
function playCrash() {
  try {
    audio();
    const t = AC.currentTime, v = vel();
    const n = noiseSrc(), hp = AC.createBiquadFilter(), pk = AC.createBiquadFilter(), g = AC.createGain();
    hp.type = 'highpass'; hp.frequency.value = 4500;
    pk.type = 'peaking'; pk.frequency.value = 9000; pk.gain.value = 6; pk.Q.value = 0.6;
    g.gain.setValueAtTime(0.45 * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
    n.connect(hp); hp.connect(pk); pk.connect(g); g.connect(drumBus);
    n.stop(t + 1.45);
  } catch(e) {}
}
function playTick(accent) {
  try {
    audio();
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = accent ? 1568 : 1046;
    g.gain.setValueAtTime(0.07, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g); g.connect(drumBus);
    o.start(t); o.stop(t + 0.06);
  } catch(e) {}
}
const DRUM_SOUND = { hat: () => playHat(false), snare: playSnare, kick: playKick, tom: playTom, crash: playCrash };
const sndFail = () => { [220,180,140,100].forEach((f,i)=>setTimeout(()=>{try{audio();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.14);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.14);}catch(e){}}, i*110)); };

// ============================================================
//  DRUM HERO GAME
// ============================================================
const LANES = [
  { snd:'hat',   key:'D', color:'#ffe94a', name:'HAT' },
  { snd:'snare', key:'F', color:'#22e6ff', name:'SNARE' },
  { snd:'kick',  key:'J', color:'#ff2d95', name:'KICK' },
  { snd:'tom',   key:'K', color:'#b44df0', name:'TOM' },
];
const PERFECT_W = 0.075, GOOD_W = 0.15;
const S = { PLAY:1, LEVELUP:2, DEAD:3 };

let state, level, score, best = 0, combo, bestCombo, groove, notes, songT, chart;
let flashes = [0,0,0,0], pops = [], flash = 0, shake = 0, lastStep, totalHit, totalNotes;
let time = 0;

// ---- procedural beat generator: each level adds complexity + speed ----
function genLevel(lv) {
  const bpm = Math.min(72 + (lv - 1) * 7, 168);
  const bars = 8;
  const step = 60 / bpm / 4;               // one 16th note
  const out = [];
  const used = new Set();
  const add = (bar, st, lane, snd) => {
    const s = bar * 16 + st, id = s * 8 + lane;
    if (used.has(id)) return;
    used.add(id);
    out.push({ t: (s + 16) * step, lane, snd: snd || LANES[lane].snd, judged: 0 });
  };
  for (let bar = 0; bar < bars; bar++) {
    const fill = lv >= 4 && bar % 4 === 3;      // drum fill every 4th bar
    // kick: half notes, then syncopation creeps in
    add(bar, 0, 2);
    add(bar, 8, 2);
    if (lv >= 5 && Math.random() < 0.5) add(bar, [6,10,14][Math.floor(Math.random()*3)], 2);
    if (lv >= 8 && Math.random() < 0.4) add(bar, 3, 2);
    // snare backbeat + ghost notes later
    if (lv >= 2) { add(bar, 4, 1); add(bar, 12, 1); }
    if (lv >= 7 && !fill && Math.random() < 0.35) add(bar, 14, 1);
    // hats: offbeats first, straight eighths later
    if (lv >= 3) {
      const until = fill ? 8 : 16;
      if (lv === 3) { for (let s = 2; s < until; s += 4) add(bar, s, 0); }
      else { for (let s = 0; s < until; s += 2) add(bar, s, 0); }
    }
    // crash opens each 4-bar section
    if (lv >= 5 && bar % 4 === 0) add(bar, 0, 3, 'crash');
    // fills: tom/snare runs in the back half of the bar
    if (fill) {
      const pat = lv >= 6 ? [8,10,11,12,13,14,15] : [8,10,12,14];
      pat.forEach((s, i) => add(bar, s, i % 2 ? 3 : 1));
    }
  }
  out.sort((a, b) => a.t - b.t);
  return { bpm, step, notes: out, endT: (bars + 1) * 16 * step };
}

// ---- geometry ----
function geom() {
  const gw = Math.min(W * 0.94, 460);
  const gx = (W - gw) / 2;
  const lw = gw / 4;
  const hitY = H - Math.max(120, H * 0.16);
  const appr = Math.max(1.05, 1.8 - level * 0.05);   // seconds from top to hit line
  return { gx, gw, lw, hitY, appr, pps: (hitY + 60) / appr };
}
function laneCX(g, i) { return g.gx + g.lw * i + g.lw / 2; }

function startLevel(lv) {
  level = lv;
  chart = genLevel(lv);
  notes = chart.notes;
  songT = 0; lastStep = -1;
  totalHit = 0; totalNotes = notes.length;
  updateHUD();
}

function updateHUD() {
  hudVal(0, combo > 1 ? 'x' + combo : '-');
  hudVal(1, level);
  hudVal(2, String(score).padStart(6, '0'));
}

function judge(lane) {
  DRUM_SOUND[LANES[lane].snd]();               // the pad always sounds — you're the drummer
  flashes[lane] = 1;
  let bestN = null, bestD = 1e9;
  for (const n of notes) {
    if (n.judged || n.lane !== lane) continue;
    const d = Math.abs(n.t - songT);
    if (d < bestD) { bestD = d; bestN = n; }
    if (n.t - songT > GOOD_W) break;
  }
  const g = geom();
  if (bestN && bestD <= GOOD_W) {
    bestN.judged = 1;
    totalHit++;
    if (bestN.snd === 'crash') DRUM_SOUND.crash();
    const perfect = bestD <= PERFECT_W;
    combo++;
    bestCombo = Math.max(bestCombo, combo);
    score += perfect ? 30 + combo : 10 + (combo >> 1);
    groove = Math.min(100, groove + (perfect ? 2 : 0.8));
    pops.push({ x: laneCX(g, lane), y: g.hitY - 34, t: 1,
      txt: perfect ? 'PERFECT' : 'GOOD', col: perfect ? NEON_YELLOW : NEON_CYAN });
    if (perfect) burst(laneCX(g, lane), g.hitY, LANES[lane].color);
    if (combo > 0 && combo % 25 === 0) toast('COMBO x' + combo + '!');
  } else if (state === S.PLAY && songT > chart.step * 16) {
    // empty hit — costs a little groove and the combo (free during count-in)
    combo = 0;
    groove -= 3;
    if (groove <= 0) die();
  }
  updateHUD();
}

function miss(n) {
  n.judged = 2;
  combo = 0;
  groove -= 11;
  shake = 5; flash = Math.max(flash, 0.5);
  const g = geom();
  pops.push({ x: laneCX(g, n.lane), y: g.hitY - 34, t: 1, txt: 'MISS', col: '#ff3355' });
  updateHUD();
  if (groove <= 0) die();
}

function die() {
  groove = 0;
  state = S.DEAD; sndFail(); flash = 1;
  best = Math.max(best, score);
  setTimeout(() => {
    $ovTitle.innerHTML = 'GAME OVER';
    $ovSub.innerHTML = 'THE GROOVE FELL APART';
    $ovStats.innerHTML = `SCORE ${String(score).padStart(6,'0')}<br>HI&nbsp;&nbsp;&nbsp; ${String(best).padStart(6,'0')}<br>LEVEL ${level} &nbsp; COMBO x${bestCombo}`;
    $ovBtn.textContent = 'CONTINUE?';
    overlay.classList.add('show');
    document.body.classList.remove('playing');
  }, 1000);
}

function levelClear() {
  state = S.LEVELUP;
  const acc = totalNotes ? Math.round(100 * totalHit / totalNotes) : 100;
  const bonus = Math.floor(groove) + acc;
  score += bonus;
  groove = Math.min(100, groove + 20);
  toast(`LEVEL ${level} CLEAR!\n+${bonus} BONUS`);
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>{try{audio();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.12);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.12);}catch(e){}}, i*100));
  updateHUD();
  setTimeout(() => {
    if (state !== S.LEVELUP) return;
    startLevel(level + 1);
    state = S.PLAY;
    toast(chart.bpm + ' BPM' + (level === 3 ? '\nHATS IN!' : level === 4 ? '\nEIGHTHS + FILLS!' : level === 5 ? '\nCRASH + SYNCO!' : ''));
  }, 1600);
}

// ---- particles ----
let particles = [];
function burst(x, y, color) {
  const cols = [color, NEON_CYAN, NEON_YELLOW, '#fff'];
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 60,
      life: .4 + Math.random()*.4, size: 3 + Math.floor(Math.random()*3),
      color: cols[Math.floor(Math.random()*cols.length)] });
  }
}
function drawParticles(dt) {
  particles = particles.filter(p => (p.life -= dt) > 0);
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt;
    ctx.globalAlpha = Math.min(1, p.life / .4);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    ctx.globalAlpha = 1;
  }
}

// ---- background ----
function drawBG() {
  ctx.fillStyle = '#04040a';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(34,230,255,.5)';
  for (let i = 0; i < 24; i++) {
    const x = ((i * 137.5) % W), y = ((i * 89.3) % H);
    ctx.globalAlpha = 0.1 + ((Math.sin(time * 2 + i) + 1) / 2) * 0.3;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
}

function draw(dt) {
  const g = geom();
  const sx = (Math.random()-.5) * shake, sy = (Math.random()-.5) * shake;
  ctx.save();
  ctx.translate(sx, sy);

  // highway
  ctx.fillStyle = 'rgba(10,8,30,.72)';
  ctx.fillRect(g.gx, 0, g.gw, H);
  for (let i = 0; i <= 4; i++) {
    const x = g.gx + g.lw * i;
    ctx.strokeStyle = i === 0 || i === 4 ? 'rgba(255,45,149,.6)' : 'rgba(34,230,255,.22)';
    ctx.lineWidth = i === 0 || i === 4 ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  // beat guide lines rolling down
  if (chart) {
    const beat = chart.step * 4;
    const firstB = Math.ceil((songT - 0.1) / beat);
    for (let b = firstB; b * beat < songT + g.appr; b++) {
      const y = g.hitY - (b * beat - songT) * g.pps;
      if (y < -4) break;
      const isBar = b % 4 === 0;
      ctx.strokeStyle = isBar ? 'rgba(255,45,149,.28)' : 'rgba(34,230,255,.12)';
      ctx.lineWidth = isBar ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(g.gx, y); ctx.lineTo(g.gx + g.gw, y); ctx.stroke();
    }
  }

  // hit line + receptors
  ctx.strokeStyle = '#fff';
  ctx.shadowColor = NEON_CYAN; ctx.shadowBlur = 12;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(g.gx - 8, g.hitY); ctx.lineTo(g.gx + g.gw + 8, g.hitY); ctx.stroke();
  ctx.shadowBlur = 0;
  const nr = Math.min(g.lw * 0.34, 26);
  for (let i = 0; i < 4; i++) {
    const cx = laneCX(g, i);
    const fl = flashes[i];
    ctx.beginPath(); ctx.arc(cx, g.hitY, nr + 4, 0, Math.PI*2);
    ctx.strokeStyle = LANES[i].color;
    ctx.globalAlpha = 0.5 + fl * 0.5;
    ctx.lineWidth = 2 + fl * 3;
    ctx.shadowColor = LANES[i].color; ctx.shadowBlur = fl * 22;
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    if (fl > 0.6) {
      ctx.beginPath(); ctx.arc(cx, g.hitY, (nr + 4) * (1 + (1 - fl) * 1.4), 0, Math.PI*2);
      ctx.globalAlpha = (fl - 0.6) * 1.2;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // notes
  if (notes) for (const n of notes) {
    const rel = n.t - songT;
    if (rel > g.appr + 0.2) break;
    const y = g.hitY - rel * g.pps;
    if (y > H + 40) continue;
    const cx = laneCX(g, n.lane);
    const crash = n.snd === 'crash';
    const r = crash ? nr * 1.15 : nr;
    if (n.judged === 1) continue;
    ctx.save();
    if (n.judged === 2) ctx.globalAlpha = 0.25;
    ctx.shadowColor = LANES[n.lane].color; ctx.shadowBlur = 14;
    ctx.fillStyle = n.judged === 2 ? '#552' : LANES[n.lane].color;
    ctx.beginPath();
    if (crash) {
      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4 + time * 2;
        const rr = k % 2 ? r * 0.55 : r;
        ctx[k ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      ctx.closePath();
    } else {
      ctx.arc(cx, y, r * 0.82, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(cx - r*0.22, y - r*0.25, r * 0.2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // drum pads + key labels
  const padY = (g.hitY + H) / 2 + 4;
  for (let i = 0; i < 4; i++) {
    const cx = laneCX(g, i);
    const pr = Math.min(g.lw * 0.4, 30);
    const press = flashes[i];
    ctx.beginPath(); ctx.ellipse(cx, padY + press * 2, pr, pr * 0.62, 0, 0, Math.PI*2);
    ctx.fillStyle = '#12102a'; ctx.fill();
    ctx.strokeStyle = LANES[i].color; ctx.lineWidth = 2;
    ctx.shadowColor = LANES[i].color; ctx.shadowBlur = 6 + press * 16;
    ctx.stroke(); ctx.shadowBlur = 0;
    ctx.font = `10px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = LANES[i].color;
    ctx.fillText(LANES[i].key, cx, padY + press * 2 + 1);
    ctx.font = `12px 'VT323', monospace`;
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fillText(LANES[i].name, cx, padY + pr * 0.62 + 12);
  }

  ctx.restore();

  // groove meter
  const gmW = Math.min(W * 0.6, 300), gmX = (W - gmW) / 2, gmY = 54;
  ctx.fillStyle = 'rgba(10,8,30,.8)';
  ctx.fillRect(gmX, gmY, gmW, 10);
  const low = groove < 30;
  ctx.fillStyle = low ? '#ff3355' : '#3dffa2';
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = low ? 10 + Math.sin(time*10)*4 : 6;
  ctx.fillRect(gmX, gmY, gmW * Math.max(0, groove) / 100, 10);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1;
  ctx.strokeRect(gmX + .5, gmY + .5, gmW - 1, 9);
  ctx.font = `7px 'Press Start 2P', monospace`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillText('GROOVE', W / 2, gmY - 5);

  // count-in / big combo
  if (chart && songT < chart.step * 16) {
    const beatN = 4 - Math.floor(songT / (chart.step * 4));
    ctx.font = `30px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = NEON_CYAN;
    ctx.shadowColor = NEON_CYAN; ctx.shadowBlur = 16;
    ctx.fillText(String(beatN), W/2, H * 0.34);
    ctx.font = `10px 'Press Start 2P', monospace`;
    ctx.fillText(chart.bpm + ' BPM — GET READY', W/2, H * 0.34 + 34);
    ctx.shadowBlur = 0;
  } else if (combo >= 10) {
    ctx.font = `16px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = NEON_YELLOW;
    ctx.globalAlpha = 0.85;
    ctx.shadowColor = NEON_YELLOW; ctx.shadowBlur = 10;
    ctx.fillText('x' + combo, W/2, H * 0.30);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  // judgment popups
  pops = pops.filter(p => (p.t -= dt * 1.6) > 0);
  for (const p of pops) {
    ctx.font = `11px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, p.t * 2);
    ctx.fillStyle = p.col;
    ctx.shadowColor = p.col; ctx.shadowBlur = 8;
    ctx.fillText(p.txt, p.x, p.y - (1 - p.t) * 36);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  drawParticles(dt);

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,51,85,${flash * .3})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function start() {
  score = 0; combo = 0; bestCombo = 0; groove = 70;
  flashes = [0,0,0,0]; pops = []; particles = [];
  flash = 0; shake = 0;
  startLevel(1);
  state = S.PLAY;
  audio();
}

// ---- main loop ----
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min((t - lastT) / 1000 || 0, 0.033);
  lastT = t;
  time += dt;
  flash = Math.max(0, flash - dt * 2.5);
  shake = Math.max(0, shake - dt * 40);
  for (let i = 0; i < 4; i++) flashes[i] = Math.max(0, flashes[i] - dt * 6);

  if (state === S.PLAY) {
    songT += dt;
    // count-in metronome
    const st = Math.floor(songT / chart.step);
    if (st !== lastStep) {
      lastStep = st;
      if (st < 16 && st % 4 === 0) playTick(st === 0);
    }
    for (const n of notes) {
      if (!n.judged && songT - n.t > GOOD_W) { miss(n); if (state !== S.PLAY) break; }
      if (n.t > songT + 0.01) break;
    }
    if (state === S.PLAY && songT > chart.endT + 0.6) levelClear();
  }

  drawBG();
  if (state) draw(dt);
}
requestAnimationFrame(frame);

// ---- input ----
const KEYMAP = { KeyD:0, KeyF:1, KeyJ:2, KeyK:3, Space:2 };
window.addEventListener('keydown', e => {
  if (overlay.classList.contains('show')) return;
  const lane = KEYMAP[e.code];
  if (lane === undefined || e.repeat) return;
  e.preventDefault();
  if (state === S.PLAY || state === S.LEVELUP) judge(lane);
});
canvas.addEventListener('pointerdown', e => {
  if (overlay.classList.contains('show')) return;
  e.preventDefault();
  if (state !== S.PLAY && state !== S.LEVELUP) return;
  const g = geom();
  const lane = Math.max(0, Math.min(3, Math.floor((e.clientX - g.gx) / g.lw)));
  judge(lane);
});

$ovBtn.addEventListener('click', () => {
  overlay.classList.remove('show');
  document.body.classList.add('playing');
  start();
});

})();
</script>
</body>
</html>
